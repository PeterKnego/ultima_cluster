[package]
name = "counter"
description = "The counter-service tutorial app: single-process and multi-process (node/service/client) binaries built on the ultima_cluster SDK"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

# The whole cluster in one process — the hello-world.
[[bin]]
name = "counter-single"
path = "src/bin/counter-single.rs"

# The three process roles, for running a real multi-node cluster locally.
[[bin]]
name = "counter-node"
path = "src/bin/counter-node.rs"

[[bin]]
name = "counter-service"
path = "src/bin/counter-service.rs"

[[bin]]
name = "counter-client"
path = "src/bin/counter-client.rs"

[dependencies]
uc2_node      = { path = "../../uc2_node", version = "2.6.0" }
uc2_service   = { path = "../../uc2_service", version = "2.6.0" }
uc2_client    = { path = "../../uc2_client", version = "2.6.0" }
uc2_net       = { path = "../../uc2_net", version = "2.6.0" }
uc2_consensus = { path = "../../uc2_consensus", version = "2.6.0" }
serde         = { workspace = true }
clap          = { version = "4", features = ["derive"] }
anyhow        = { workspace = true }
tempfile      = { workspace = true }
signal-hook   = { workspace = true }

[dev-dependencies]
libc          = { workspace = true }
