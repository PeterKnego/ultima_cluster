# --- Matched sweep (identical for UC and Aeron) ---
rate_ladder: [100, 500, 1000, 2000, 5000, 10000, 20000]  # msgs/s, one run per rung
payload_bytes: 64
warmup_seconds: 2
measure_seconds: 10
batch_size: 1            # per-message pacing (Aeron); UC is open-loop per-message
inflight: 128            # UC --inflight for compared points; Aeron is open-loop
durability: consistent   # 'consistent' = both fsync; 'none' = both non-durable. NEVER mixed.
transport: quic          # 'quic' (default) or 'udp' — inter-node transport under test
netem_loss_pct: 0        # packet loss % applied via tc qdisc; 0 = no shaping
netem_delay_ms: 0        # one-way delay ms applied via tc qdisc; 0 = no shaping
netem_iface: eth0        # interface to shape (override per cloud env)
aeron_ingress: udp       # 'udp' (proven) | 'ipc' (gated behind task13 §11 fix, do not use yet)
aeron_enabled: true      # false = UC-only fleet (skip Aeron build + Aeron sweep), used by the throughput loop
# NOTE (v1 retired): UC benchmarking is now driven by the v2 gate orchestrators
# (scripts/m6_fleet_gate.py + the m5_gate/m6_gate examples), not the ansible run
# role. The old UC commit-path sweep knobs (uc_pipeline_depth, uc_ipc_mode,
# uc_sync_core, admission/spin budgets, ...) were removed with the v1 stack.

# --- Build sources ---
aeron_benchmarks_repo: "https://github.com/aeron-io/benchmarks.git"
aeron_benchmarks_ref: "6afb215"   # pinned 2026-07-03 for reproducibility + external-service patch
# ---- aeron-go arm (Go ClusteredServiceContainer A/B) ----
aerongo_enabled: false            # true = run the Go-service arm after the Java arm
aerongo_repo: "https://github.com/lirm/aeron-go.git"
aerongo_ref: "8b05ad1"            # upstream HEAD 2024-06-06; proven against Aeron 1.43 AND 1.51
aerongo_dir: "/opt/bench/aerongo"
jdk_version: "21"
uc_src_mode: "rsync"                     # 'rsync' local working tree | 'git'
uc_git_ref: ""                           # used when uc_src_mode=git
uc_repo_url: ""                          # used when uc_src_mode=git
uc_local_path: "{{ playbook_dir }}/../.."  # repo root (ultima_cluster), for rsync mode
ud_local_path: "{{ playbook_dir }}/../../../ultima_db"  # sibling repo (external path dep)

# --- Layout on hosts ---
remote_home: "/opt/bench"
aeron_deploy_dir: "/opt/bench/aeron-deploy"
uc_src_dir: "/opt/bench/uc"
ud_src_dir: "/opt/bench/ultima_db"   # so /opt/bench/uc/../ultima_db resolves on the host
uc_target_bin: "/opt/bench/uc/target/release"

# --- Aeron port bases (matches canonical cluster_localhost ranges) ---
# member fields: ingress, consensus, log, catchup, archive-control
aeron_port_base: { node0: 20000, node1: 21000, node2: 22000 }

# --- UC ports (per node) ---
uc_raft_port: { node0: 7001, node1: 7002, node2: 7003 }
uc_app_id: "uc-bench-dist"

# --- Results ---
results_local_dir: "{{ playbook_dir }}/../../bench-out/dist"
