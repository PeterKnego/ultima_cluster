[workspace]
resolver = "2"
members = ["uc_protocol", "uc_log", "uc_net", "uc_consensus", "uc_sim", "uc_node", "uc_ctl", "uc_service", "uc_client", "uc_crypto", "uc_lincheck", "uc_journal", "examples/uc_crashtest", "examples/counter", "uc_remote", "uc_gateway"]
exclude = ["fuzz"] # cargo-fuzz crate: nightly-only, its own [workspace]; see fuzz/README.md

[workspace.package]
edition = "2024"
version = "2.9.0"
license = "Apache-2.0"
authors = ["Peter Knego"]
repository = "https://github.com/PeterKnego/ultima_cluster"
homepage = "https://github.com/PeterKnego/ultima_cluster"
# FINAL (M12c Task 2, probed 2026-08-23; clippy fix round same day): floor =
# std::fs::File::try_lock_exclusive/unlock (uc_node/src/backup.rs), stable
# since 1.89.0. Probed with the already-installed 1.89.0 toolchain: `cargo
# +1.89.0 check --workspace --all-targets --locked` (green), `cargo +1.89.0
# test -p uc_crypto -p uc_protocol --locked` (green, 132 + 71 passed).
# `cargo +1.89.0 clippy --workspace --all-targets --locked -- -D warnings`
# was RED on two 1.89-only lints, both now silenced with a targeted
# `#[allow(..., reason = "...")]` rather than a portability-losing rewrite:
# clippy::ptr_arg on uc_node/src/node.rs's `exec(&mut self, act: Action,
# _work: &mut Vec<Event>)` (`_work` is deliberately `Vec`, not `[Event]`, as
# a reserved re-entrant push queue — see the doc comment above `exec`), and
# clippy::unnecessary_cast on uc_node/src/bin/uc2-node.rs's
# `free_disk_bytes` (`buf.f_bavail as u64 * buf.f_frsize as u64` normalizes
# `libc::statvfs` field widths that vary by target — a no-op cast only on
# this specific build target). Neither lint fires on the pinned 1.96's
# clippy. With both allows in place, `cargo +1.89.0 clippy --workspace
# --all-targets --locked -- -D warnings` is GREEN, so the CI `msrv` job runs
# `clippy`, not just `check`.
rust-version = "1.89"
keywords = ["consensus", "raft", "replication", "aeron", "low-latency"]
categories = ["network-programming", "database-implementations"]

[workspace.dependencies]
# core
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
bytes = { version = "1", features = ["serde"] }
thiserror = "2"
tracing = "0.1"

# storage
uc_journal = { path = "uc_journal", version = "2.8.1" }
# crates.io dep (published 0.1.1) — the workspace builds standalone, no sibling
# checkout needed. `persistence` is required for snapshot_stream /
# install_snapshot_stream. For lockstep local development against a checkout,
# temporarily add: [patch.crates-io] ultima-db = { path = "../ultima_db" }
ultima-db = { version = "0.1.1", features = ["persistence"] }

# M3 — shmem IPC
memmap2 = "0.9"
parking_lot = "0.12"
page_size = "0.6"
crc32fast = "1"
fs2 = "0.4"
rand = "0.9"

# dev
tempfile = "3"
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wait-timeout = "0.2"

# cli + bench harness (uc2 gate examples)
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"

# M8 wire crypto. Versions verified against crates.io 2026-07-28. The AEAD/hash
# generation deliberately MATCHES the one snow pins internally (aes-gcm 0.10 /
# sha2 0.10 era) so the binary carries ONE AES-GCM implementation, not two.
# `use-chacha20poly1305` is enabled despite the handshake pattern being
# AES-GCM-only (Noise_IK_25519_AESGCM_SHA256): snow 0.10.0 has an upstream bug
# where resolvers/default.rs only imports `KeyInit`/`AeadInPlace` under the
# chacha cfg, so the AES-only feature combination fails to compile
# (Aes256Gcm::new unresolved). snow 0.9.6 declared chacha20poly1305
# non-optional, so every prior release linked it anyway — this costs nothing
# new. The chacha path is linked but never invoked.
#
# `risky-raw-split` is enabled deliberately (ruling 2026-07-28, spec §5): UC
# takes the two transport keys out of the finished handshake and seals with
# its OWN envelope, because snow's transport modes hard-code empty associated
# data (cipherstate.rs:170) and would leave the 16-byte header unauthenticated
# on the pairwise path. The "risky" in the name is snow warning that the
# caller then owns nonce management — which this design does deliberately and
# structurally, per-sender-per-boot, in `uc_crypto::schedule::derive_send_key`.
# Pure feature flag: no new crates, no version movement.
#
# M12c Task 1 (dead-dep sweep, 2026-08-23): deliberately NOT requesting snow's
# `std` feature. `std` looks free (this crate always builds against std
# anyway) but snow's own feature table defines `std = [..., "ring/std", ...]`,
# which implicitly activates snow's *optional* `ring` dependency even though
# the resolver actually in use here is `default-resolver` (RustCrypto), never
# `ring-resolver`. That silently violated the "ONE AES-GCM implementation"
# claim two paragraphs up — `cargo tree -i ring` showed `ring` pulled in
# solely through this feature, not through the since-removed quinn/rustls
# deps as originally assumed. Verified: dropping `std` still builds the full
# workspace and `cargo test -p uc_crypto` (132/132) is unaffected; `ring`
# disappears from `cargo tree -i ring` entirely.
snow = { version = "0.10", default-features = false, features = ["default-resolver", "use-aes-gcm", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom", "risky-raw-split"] }
# `zeroize` scrubs the GHASH subkey; the paired `aes` feature below scrubs the
# AES round keys (T5 review remedy — AES round keys are invertible back to the
# 32-byte key, so a core dump / swap read could otherwise recover a live
# per-sender key). Additive features, no new crates, no version movement:
# `aes` 0.8.4 feature-unifies with the copy `aes-gcm` already links.
aes-gcm = { version = "0.10", features = ["zeroize"] }
aes = { version = "0.8", default-features = false, features = ["zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
# `static_secrets` is required for `StaticSecret` — not in the 2.x default
# feature set (which targets ephemeral-only Diffie-Hellman).
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"

# M9 daemon. Versions verified against crates.io 2026-08-19.
toml = "0.9"
signal-hook = "0.3"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
