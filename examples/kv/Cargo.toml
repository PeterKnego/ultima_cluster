[package]
name = "kv_store"
description = "The replicated key-value store dogfood app: kv-service (the service half) and kv (a remote CLI client) built on the ultima_cluster SDK — the worked example for docs/tutorials/build-an-application.md"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

# The service half: the KV state machine attached to a uc2-node.
[[bin]]
name = "kv-service"
path = "src/bin/kv-service.rs"

# The remote CLI client: talks TCP to a uc2-gateway via uc_remote.
[[bin]]
name = "kv"
path = "src/bin/kv.rs"

# A load generator for the throughput/latency arm.
[[bin]]
name = "kv-load"
path = "src/bin/kv-load.rs"

[features]
# The three-node cluster tests spawn the release binaries and take tens of
# seconds; opt in with `cargo test --features cluster-tests`.
cluster-tests = []

[dependencies]
uc_service    = { path = "../../uc_service", version = "2.12.0" }
uc_remote     = { path = "../../uc_remote", version = "2.12.0" }
# `default-features = false` drops the `export` feature, and with it the
# `uc_node` dependency: `kv-service` embeds the replay DRIVER, it never
# exports a corpus, and a service binary has no business linking the
# consensus crate. `tests/gen_corpus.rs` does export one — the
# dev-dependency below turns the feature back on for test builds only.
uc_diffreplay = { path = "../../uc_diffreplay", version = "2.12.0", default-features = false }
bytes         = { workspace = true }
clap          = { workspace = true }
anyhow        = { workspace = true }
signal-hook   = { workspace = true }

[dev-dependencies]
# `tests/gen_corpus.rs` only: the regression corpus is generated from a REAL
# in-process node driven over the REAL shmem path, so the recorded bytes are
# the bytes a live `kv` request produces. `uc_client` for the bytes-level
# `Engine` (`Client` is serde-typed; KvSm is a raw SM), `uc_net`/`uc_protocol`
# for the two `NodeConfig` fields that need their types.
uc_node     = { path = "../../uc_node", version = "2.12.0" }
uc_client   = { path = "../../uc_client", version = "2.12.0" }
uc_net      = { path = "../../uc_net", version = "2.12.0" }
uc_protocol = { path = "../../uc_protocol", version = "2.12.0" }
# `tests/gen_corpus.rs` calls `Corpus::export`, which lives behind
# `uc_diffreplay`'s `export` feature (see the note above).
uc_diffreplay = { path = "../../uc_diffreplay", version = "2.12.0", features = ["export"] }
proptest = "1"
tempfile = { workspace = true }
libc     = { workspace = true }
