name: docs

# Publishes rustdoc for the workspace's library crates to GitHub Pages on every
# push to main. docs.rs renders each PUBLISHED crate separately, at whatever
# version was last published; this renders the whole workspace together, at
# `main`, behind one landing page — which is what you want when the question
# spans crates ("how does uc_service reach uc_log?") or when main is ahead
# of the last release.
#
# Deliberately NOT gated on rustdoc warnings: the tree carries pre-existing
# intra-doc-link warnings, and a docs *deploy* is the wrong place to discover
# them. Add `RUSTDOCFLAGS: -D warnings` here once they are cleared, or gate them
# in ci.yml where a failure blocks the PR that caused it.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one midway — a half-published site is
# worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      # Internal doc links, before anything is compiled: it takes a second and
      # a broken link should not cost a rustdoc build to discover. FAILS on a
      # dead file or a dead GitHub anchor; md-tui slug divergences are printed
      # as warnings only, deliberately — see the script's module docstring.
      - name: Documentation links
        run: python3 scripts/check_doc_links.py

      # --lib drops the bins (uc2ctl is an operator CLI, not an API), and the
      # two example crates are excluded outright.
      - name: Build rustdoc
        run: >
          cargo doc --workspace --no-deps --lib
          --exclude counter --exclude uc_crashtest

      - name: Install the landing page
        run: cp .github/pages/index.html target/doc/index.html

      # A workspace produces no root index, so the landing page is hand-written
      # — which means it can silently fall behind a newly added crate. Fail
      # loudly instead: a crate that ships without a link is unreachable from
      # the front door, and nobody would notice.
      - name: Guard against landing-page drift
        run: |
          missing=0
          for dir in target/doc/*/; do
            crate=$(basename "$dir")
            case "$crate" in src|static.files|trait.impl|type.impl|search.index) continue ;; esac
            [ -f "$dir/index.html" ] || continue
            if ! grep -q "\"$crate/index.html\"" target/doc/index.html; then
              echo "::error::crate '$crate' is documented but not linked from .github/pages/index.html"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
