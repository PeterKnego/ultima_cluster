[workspace]
resolver = "2"
members = ["uc_protocol", "uc2_log", "uc2_net", "uc2_consensus", "uc2_sim", "uc2_node", "uc2_service", "uc2_client", "uc_service", "uc_node", "uc_client", "uc_autobench", "uc-lincheck", "uc-rt-busyspin", "ultima_journal", "examples/counter_loop", "examples/uc-crashtest"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
authors = ["Peter Knego"]

[workspace.dependencies]
# core
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
bytes = { version = "1", features = ["serde"] }
thiserror = "2"
tracing = "0.1"

# async
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "time", "fs", "io-util"] }
async-trait = "0.1"
futures = "0.3"

# raft + storage
# Bumped alpha.21 -> alpha.25 via local checkout (alpha.25 not yet on crates.io).
# TODO: revert to crates.io version deps once alpha.25 is published.
openraft = { path = "../openraft/openraft", features = ["serde"] }
openraft-legacy = { path = "../openraft/legacy" }
ultima-journal = { path = "ultima_journal" }
# `persistence` is required for snapshot_stream / install_snapshot_stream.
ultima-db = { path = "../ultima_db", features = ["persistence"] }

# QUIC + TLS (M2)
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
rustls-pemfile = "2"

# M3 — shmem IPC
memmap2 = "0.9"
parking_lot = "0.12"
page_size = "0.6"
crc32fast = "1"
fs2 = "0.4"
rand = "0.9"
dashmap = "6"

# dev
tempfile = "3"
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wait-timeout = "0.2"

# uc_autobench
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
jiff = { version = "0.1", features = ["serde"] }
toml = "0.8"
serde_json = "1"
hdrhistogram = "7"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
