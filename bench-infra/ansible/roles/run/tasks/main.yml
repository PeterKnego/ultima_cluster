---
# Clean stale cluster state so re-runs start fresh (stale drivers / cluster dirs
# / leftover JVMs would break election or bind ports). Bracket trick on pkill
# ('[i]o.aeron') so the pattern does not match pkill's own shell command line.
- name: Clean stale cluster state
  ansible.builtin.shell: |
    pkill -9 -f '[i]o.aeron' || true
    pkill -9 -f '[u]c-node-launch' || true
    rm -rf /dev/shm/*-driver /dev/shm/uc-* {{ remote_home }}/cluster {{ remote_home }}/uc-data {{ remote_home }}/results
    mkdir -p {{ remote_home }}/results
  changed_when: false

- name: Ensure results dir is owned by the run user
  ansible.builtin.file:
    path: "{{ remote_home }}/results"
    state: directory
    owner: "{{ ansible_user_id }}"
    mode: "0755"

# ---- Aeron: start drivers + nodes on every host, sweep on node0, then tear down ----
- name: Start Aeron media driver
  ansible.builtin.shell: |
    export JAVA_HOME="$(dirname $(dirname $(readlink -f $(which javac))))"
    export JVM_OPTS="-Xms16M"
    setsid {{ aeron_deploy_dir }}/scripts/aeron/media-driver \
      {{ remote_home }}/aeron-cfg/cluster.properties \
      {{ remote_home }}/aeron-cfg/node.properties > {{ remote_home }}/md.out 2>&1 < /dev/null &
  changed_when: false
  when: aeron_enabled | default(true) | bool

- name: Start Aeron cluster node
  ansible.builtin.shell: |
    export JAVA_HOME="$(dirname $(dirname $(readlink -f $(which javac))))"
    export JVM_OPTS="-Xms16M -Dio.aeron.benchmarks.output.directory={{ remote_home }}/results"
    setsid {{ aeron_deploy_dir }}/scripts/aeron/cluster-node \
      {{ remote_home }}/aeron-cfg/cluster.properties \
      {{ remote_home }}/aeron-cfg/node.properties > {{ remote_home }}/node.out 2>&1 < /dev/null &
  changed_when: false
  when: aeron_enabled | default(true) | bool

- name: Wait for cluster election to settle
  ansible.builtin.pause:
    seconds: 20
  run_once: true
  when: aeron_enabled | default(true) | bool

- name: Copy Aeron sweep script to node0
  ansible.builtin.copy:
    src: run_aeron_sweep.sh
    dest: "{{ remote_home }}/run_aeron_sweep.sh"
    mode: "0755"
  when: aeron_enabled | default(true) | bool and node_role == "node0"

- name: Drive Aeron rate ladder (node0)
  ansible.builtin.command: >
    {{ remote_home }}/run_aeron_sweep.sh
    {{ remote_home }}
    {{ rate_ladder | join(',') }}
    {{ payload_bytes }} {{ warmup_seconds }} {{ measure_seconds }}
    {{ batch_size }}
  when: aeron_enabled | default(true) | bool and node_role == "node0"
  changed_when: true

- name: Stop Aeron JVMs
  ansible.builtin.shell: "pkill -9 -f '[i]o.aeron' || true"
  changed_when: false
  failed_when: false
  when: aeron_enabled | default(true) | bool

# ---- UC: start one uc-node per host, sweep on node0, then tear down ----
# Wrap in a block so netem is always removed even if the sweep fails.
- name: Apply netem shaping (when loss or delay > 0)
  ansible.builtin.command: >
    tc qdisc add dev {{ netem_iface }} root netem
    loss {{ netem_loss_pct }}%
    delay {{ netem_delay_ms }}ms
  become: true
  when: netem_loss_pct | int > 0 or netem_delay_ms | int > 0
  changed_when: true

- block:
    - name: Start UC node
      ansible.builtin.shell: |
        . {{ remote_home }}/uc-peers.env
        export UC_DURABILITY={{ 'eventual' if durability == 'none' else 'consistent' }}
        export UC_TRANSPORT={{ transport }}
        setsid UC_PIPELINE_DEPTH={{ uc_pipeline_depth }} {{ uc_target_bin }}/uc-node-launch \
          --node-id $UC_NODE_ID --listen $UC_LISTEN $UC_PEERS \
          --app-id $UC_APP_ID --with-service \
          --instance-dir /dev/shm/uc-{{ node_role }} \
          --data-dir {{ remote_home }}/uc-data \
          > {{ remote_home }}/uc-node.out 2>&1 < /dev/null &
      changed_when: false

    - name: Wait for UC leader election
      ansible.builtin.pause:
        seconds: 15
      run_once: true

    - name: Copy UC sweep script to node0
      ansible.builtin.copy:
        src: run_uc_sweep.sh
        dest: "{{ remote_home }}/run_uc_sweep.sh"
        mode: "0755"
      when: node_role == "node0"

    - name: Drive UC rate ladder (node0)
      ansible.builtin.command: >
        {{ remote_home }}/run_uc_sweep.sh
        {{ uc_target_bin }}/commit-path-load
        /dev/shm/uc-node0
        {{ uc_app_id }}
        {{ rate_ladder | join(',') }}
        {{ payload_bytes }} {{ inflight }} {{ measure_seconds }}
        {{ warmup_seconds }}
        {{ remote_home }}/results/uc_sweep.csv
      when: node_role == "node0"
      changed_when: true

    - name: Stop UC JVMs/procs
      ansible.builtin.shell: "pkill -9 -f '[u]c-node-launch' || true; pkill -9 -f '[k]v_service' || true"
      changed_when: false
      failed_when: false

  always:
    - name: Remove netem shaping (always, idempotent)
      ansible.builtin.command: tc qdisc del dev {{ netem_iface }} root
      become: true
      failed_when: false
      changed_when: false
      when: netem_loss_pct | int > 0 or netem_delay_ms | int > 0
