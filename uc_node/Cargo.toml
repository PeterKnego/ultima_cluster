[package]
name = "uc_node"
description = "The ultima_cluster node: four single-writer polling agents, the cnc page, elections, and the uc2-node daemon"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "uc2-node"
path = "src/bin/uc2-node.rs"

[dependencies]
uc_protocol = { path = "../uc_protocol", version = "2.11.0" }
uc_obs = { path = "../uc_obs", version = "2.11.0" }
# Already a workspace dependency (uc_crypto uses it) — no new crate enters the
# lockfile. Used only to digest the config FILE at load, for the (build,
# config) release identity of twelve-factor #5.
sha2 = { workspace = true }
uc_log = { path = "../uc_log", version = "2.11.0" }
uc_net = { path = "../uc_net", version = "2.11.0" }
uc_consensus = { path = "../uc_consensus", version = "2.11.0" }
uc_crypto = { path = "../uc_crypto", version = "2.11.0" }
# The cluster FSM (spec §4) implements uc_service's RawStateMachine +
# SnapshotStateMachine so it is "treated like any FSM". This is a RUNTIME
# edge; uc_service's dev-dependency on uc_node stays a dev-only cycle. The
# crates.io publish order therefore flips: uc_service BEFORE uc_node.
uc_service = { path = "../uc_service", version = "2.11.0" }
uc_journal = { workspace = true }
thiserror = { workspace = true }
fs2 = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
libc = { workspace = true }
signal-hook = { workspace = true }
clap = { workspace = true }
crc32fast = { workspace = true }

[dev-dependencies]
# Asymmetric cycle: uc_node → uc_service is a runtime dependency (for the
# cluster FSM's traits); uc_service → uc_node remains dev-only and unversioned
# so `cargo package` strips it when uc_service publishes before uc_node is
# available on crates.io. The Task 11 barrier test drives the full read path
# with a real service + client.
uc_service = { path = "../uc_service" }
uc_client = { path = "../uc_client", version = "2.11.0" }
# Cluster-FSM plan 1 task 8: `admin_auth.rs`'s settings-apply capstone drives
# `uc2ctl settings apply`/`show` as library calls (`uc_ctl::settings::{apply,
# show}`) rather than shelling out to the built binary. The SAME asymmetric
# cycle as the `uc_service` entry above, with the two crates swapped: `uc_ctl`
# depends on `uc_node` NORMALLY (it needs `uc_node::cluster_agent` and the
# node types to build the admin CLI), so this edge only exists in test
# builds. Deliberately unversioned, for the same reason `uc_lincheck`/
# `uc_sim` below are: a versioned path dev-dep would make `cargo package`
# require it from the registry, which fails since `uc_ctl` is what depends on
# `uc_node`, not the other way around.
uc_ctl = { path = "../uc_ctl" }
# L3 lincheck port (Task 13): the WGL checker/history/model + CAS-register SM,
# built for the v2 SDK trait only (v1 `uc_service` is not pulled in here).
# NOTE: deliberately no `version =` — uc_lincheck is `publish = false` (never
# on crates.io); a versioned path dev-dep would make `cargo package` require
# it to resolve from the registry and fail forever. Cargo silently strips a
# path dev-dependency with no version from the packaged manifest instead.
uc_lincheck = { path = "../uc_lincheck", default-features = false, features = ["v2"] }
# The §4.3 leader-pass ORACLE (`uc_sim::timers::check_frames`), reused by
# `tests::timers_differential` over the frame sequence a real `do_work` pass
# appended — so the ordering predicate is checked against the shipped code and
# not only against `uc_sim`'s hand-written model of it. Same unversioned idiom
# as `uc_lincheck` above and for the same reason: `uc_sim` is `publish = false`,
# so a `version =` here would make `cargo package` demand it from the registry.
# No dependency cycle: `uc_sim` does not depend on `uc_node`.
uc_sim = { path = "../uc_sim" }
serde = { workspace = true }
bincode = { workspace = true }
tempfile = { workspace = true }
# Test-only: hand-write a ring file header (the unsized-claim wedge) the way a
# killed producer leaves it — see node.rs::tests::wedge_ring_file.
memmap2 = { workspace = true }
rand = { workspace = true }
# m5_gate (Task 15) / m6_gate (M6 Task 10): CLI parsing, latency histogram,
# error plumbing for the node/service/learner reference-binary + gate roles.
clap = { workspace = true }
hdrhistogram = { workspace = true }
anyhow = { workspace = true }

[features]
# Fault injection for the elle mutation-testing tier. Off in every normal
# build; even when compiled in, inert unless UC2_MUTATION is set.
mutation-testing = ["uc_consensus/mutation-testing"]

# read_profile (leader-lease profile harness) carries unit tests for its
# /proc occupancy parser; `test = true` makes `cargo test` run them.
[[example]]
name = "read_profile"
test = true

# `cfg(fuzzing)` is set by cargo-fuzz for the whole dependency graph; it gates
# the M12d `obs::http::route_raw` / `ObsSources::for_tests` seam (test-and-fuzz
# only, never in a shipped build). Declaring it here keeps `unexpected_cfgs`
# happy without turning the seam into a public Cargo feature, which would make
# it part of the crate's API surface.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
