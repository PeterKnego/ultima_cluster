# =============================================================================
# Aeron Cluster benchmark config — IPC-ingress variant (matched to ultima_cluster)
# Shared by all 3 consensus modules AND the client (passed first on the cmd line).
#
# Goal: client<->node over SHARED MEMORY (aeron:ipc), node<->node over UDP.
# This mirrors ultima_cluster: shmem client edge + network intra-node.
#
# DIFF vs shipped scripts/samples/cluster_localhost/cluster.properties:
#   - ingress.channel:   aeron:udp  ->  aeron:ipc     (client edge = shmem)
#   - ingress.endpoints: REMOVED  (must be absent; AeronCluster.Context rejects
#                                  non-null ingressEndpoints when ingress is IPC,
#                                  see AeronCluster.java:1466-1472)
#   - appointed.leader.id=0 ADDED  (IPC ingress reaches only the co-located node;
#                                   a follower would redirect the client to the
#                                   leader's UDP endpoint, which IPC can't follow.
#                                   Pin leader = the co-located node.)
#   - replication.channel: UNCHANGED (aeron:udp)  <- this is what we measure
# =============================================================================

# Member layout: id, ingress, consensus, log, catchup, archive  (one per member).
# The consensus/log/catchup/archive endpoints stay UDP -> intra-node = network.
# For cross-host, replace `localhost` with each node's real IP/hostname.
aeron.cluster.members=0,localhost:20000,localhost:20001,localhost:20002,localhost:20003,localhost:20004|\
 1,localhost:21000,localhost:21001,localhost:21002,localhost:21003,localhost:21004|\
 2,localhost:22000,localhost:22001,localhost:22002,localhost:22003,localhost:22004

# --- CLIENT EDGE: shared memory ---
aeron.cluster.ingress.channel=aeron:ipc
# NOTE: aeron.cluster.ingress.endpoints intentionally REMOVED (see header).

# --- INTRA-NODE: network (this is the axis under test: UDP vs ultima's QUIC) ---
aeron.cluster.replication.channel=aeron:udp?endpoint=localhost:0
aeron.archive.replication.channel=aeron:udp?endpoint=localhost:0
aeron.archive.recording.events.enabled=false

# --- Pin leader to the co-located node (node0) so IPC ingress lands on leader ---
aeron.cluster.appointed.leader.id=0

# Local-run window/buffer trimming (drop these for production-like hosts).
aeron.term.buffer.sparse.file=true
aeron.pre.touch.mapped.memory=false
aeron.socket.so_sndbuf=128k
aeron.socket.so_rcvbuf=128k
aeron.rcv.initial.window.length=128k
aeron.term.buffer.length=128k
aeron.ipc.term.buffer.length=128k

# Benchmark knobs (mirror ultima's commit-path-load run params).
#io.aeron.benchmarks.track.history=true
#io.aeron.benchmarks.cluster.snapshot.size=0
#io.aeron.benchmarks.message.transceiver=io.aeron.benchmarks.aeron.ClusterMessageTransceiver
#io.aeron.benchmarks.iterations=1000
