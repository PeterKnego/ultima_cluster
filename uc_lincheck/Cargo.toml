[package]
name = "uc_lincheck"
description = "Test/verification library: WGL linearizability checker, op history recorder, model, and the in-memory CAS-register state machine"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[features]
# `v2` binds `RegisterSm: uc_service::StateMachine` for the L3 lincheck port.
# (The v1 feature was retired with the v1 stack; v2 is now the only impl.)
default = ["v2"]
v2 = ["dep:uc_service"]

[dependencies]
uc_service = { path = "../uc_service", version = "2.10.0", optional = true }
# The oracle's table clause (time-and-timers plan 2) reasons with the FROZEN
# recurrence arithmetic itself (`ScheduleRule::latest_at_or_before`), not a
# re-derivation of it — a second implementation of the rule in the checker
# could agree with a wrong node. Non-optional: the oracle is compiled with or
# without the `v2` feature.
uc_protocol = { path = "../uc_protocol", version = "2.10.0" }
serde       = { workspace = true }
bincode     = { workspace = true }
