name: ci

# Fast correctness gate for PRs and pushes to main (~minutes, not the full
# proof suite — that's nightly.yml):
#   * clippy — the workspace lint gate (--all-targets, -D warnings), plus
#     passes over uc_service's and uc_gateway's non-default features, which
#     the default workspace build never compiles.
#   * tests — the whole workspace EXCEPT uc_node's slow WGL capstones
#     (lin_v2 / lin_partition_v2 spin multi-node clusters of busy-polling
#     agents for minutes; nightly runs them). uc_node's fast integration
#     suites (smoke, failover, learner, purge_safety, query_barrier) DO run
#     here — they're the election/truncation/reconstruction regression net,
#     and (M12b) admin_auth / daemon_refusals, the admin authn+audit net.
#   * fmt — `cargo fmt --all --check`. The one-shot reformat that this gate
#     was deferred behind LANDED 2026-08-31 (3 393 hunks, 189 files); the
#     deferral's re-run condition — both long-lived worktrees merged — was
#     met, so the drift is now zero and CI keeps it there. It runs FIRST and
#     is seconds long: a formatting-only failure should not cost a full
#     clippy+test cycle to discover.
#   * msrv — `cargo clippy -D warnings` (check is implicit in clippy) on the
#     MSRV floor toolchain read from Cargo.toml's `rust-version`, so the
#     stated floor can't silently drift from what actually compiles/lints
#     clean. See that field's comment.
# Deliberately NOT run here:
#   * fmt over `fuzz/` — that crate is outside the workspace (its own
#     `[workspace]` + lockfile, nightly toolchain), so `--all` never reaches
#     it and neither does this job.
#   * lin_v2 / lin_partition_v2 / sim-heavy / loom / hard-crash — nightly.yml.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Formatting (cargo fmt --all --check)
        run: cargo fmt --all -- --check
      - name: Clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (uc_service + apply-profile)
        run: cargo clippy -p uc_service --features apply-profile --all-targets -- -D warnings
      - name: Clippy (uc_gateway + test-util)
        run: cargo clippy -p uc_gateway --features test-util --all-targets -- -D warnings
      - name: Tests (workspace, minus slow capstones)
        run: cargo test --workspace --exclude uc_node
      - name: Tests (uc_node fast integration)
        run: >
          cargo test -p uc_node --lib
          --test smoke --test failover --test learner
          --test purge_safety --test query_barrier
          --test admin_auth --test daemon_refusals

  # MSRV floor gate. Reads the floor from Cargo.toml's `rust-version`
  # (`[workspace.package]`, single source of truth — see that field's
  # comment for how it was probed) via `cargo metadata`, so this job can't
  # silently drift out of sync with the manifest. Runs `cargo clippy -D
  # warnings` (check is implicit in clippy) so the floor toolchain is both
  # compile-clean and lint-clean, matching the pinned-stable `test` job's
  # bar. Clippy lints can differ across toolchain versions — where 1.89's
  # clippy flags something the pinned 1.96's doesn't (clippy::ptr_arg on
  # uc_node's deliberately-`Vec`-typed re-entrant queue param;
  # clippy::unnecessary_cast on a cross-platform `libc::statvfs` field-width
  # normalization in uc2-node.rs), the code carries a targeted
  # `#[allow(..., reason = "...")]` rather than a portability-losing rewrite
  # — see those two call sites.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Resolve MSRV from Cargo.toml
        # Runs on whatever toolchain rust-toolchain.toml pins (currently
        # 1.96.0) — the MSRV toolchain isn't installed yet at this point.
        # Harmless: cargo metadata only reads the manifest, it compiles
        # nothing.
        id: msrv
        run: |
          MSRV=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="uc_node") | .rust_version')
          echo "MSRV resolved to $MSRV"
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"
      - name: Install MSRV toolchain (${{ steps.msrv.outputs.version }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
      - name: cargo clippy --workspace --all-targets (MSRV floor)
        # Explicit `+<version>` (not plain `cargo`) so this genuinely runs
        # on the MSRV toolchain rather than being redirected by the
        # checked-out rust-toolchain.toml's directory override.
        run: cargo +${{ steps.msrv.outputs.version }} clippy --workspace --all-targets --locked -- -D warnings

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # NOTE: `arguments` maps to cargo-deny's own TOP-LEVEL flags (before
      # `check`), and the action's default `arguments` value is actually
      # `--all-features` — so this first pass is pinned to `arguments: ""`
      # to genuinely get the plain default-feature-set graph (matching
      # deny.toml's `[graph] all-features = false`), distinct from the
      # second pass below.
      - name: cargo deny (default features)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
          arguments: ""
      # Second pass with every feature on, so anything a non-default feature
      # drags in (uc_service/apply-profile, uc_gateway/test-util,
      # uc_protocol/uc-bench-probes, uc_journal/bench-support, the two
      # mutation-testing features) is actually in the resolved graph. No
      # feature adds a crate today — the `ultima_db` adapter, which used to be
      # the reason for this step, was removed 2026-08-31 — but the step stays
      # so the day one does, its licences are caught here rather than at
      # release time.
      - name: cargo deny (--all-features)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
          arguments: --all-features

  # M12c Task 1: smoke-tests that the 13 publishable crates (see deny.toml's
  # bans comment in root Cargo.toml) actually package/publish, so a manifest
  # regression (a path dep missing `version =`, a stray `publish = false`,
  # a keyword crates.io would reject, ...) is caught here instead of at
  # release time.
  publish-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # crates.io rejects publish-time metadata (keyword length/count,
      # unknown category slugs, ...) that neither `cargo package` nor
      # `cargo publish --dry-run` ever checks (dry-run stops before the
      # server-side validation). Catch it here, not at the real `cargo
      # publish`.
      - name: Publish metadata guard (keywords/categories)
        run: ./scripts/check_publish_metadata.sh
      # `cargo package` rewrites every path dependency into a registry
      # dependency and then requires it to actually resolve — even with
      # --no-verify (which only skips the build step, not this metadata
      # check). Pre-first-publish, NOTHING in this DAG is on crates.io yet,
      # so packaging each of the 12 crates in its OWN `cargo package`
      # invocation would fail forever for every non-leaf crate (this is not
      # a temporary bootstrap gap: uc_node's dev-dependency on uc_service,
      # for one example, is a genuine dev-only cycle no publish order can
      # fully avoid — see the `allow-wildcard-paths` note in deny.toml and
      # the per-crate "deliberately unversioned" Cargo.toml comments). Cargo
      # DOES resolve cross-references among packages selected in the SAME
      # `-p ... -p ...` invocation against each other locally instead of
      # hitting the registry — it topo-sorts the selected set itself, so
      # neither the `-p` flag order nor the workspace `members` order
      # matters here. So: one batched command for all 13 crates, not 13
      # separate ones (which would each fail — see above).
      - name: cargo package (all 13 publishable crates)
        run: >
          cargo package --no-verify
          -p uc_journal -p uc_protocol -p uc_obs -p uc_crypto -p uc_log
          -p uc_consensus -p uc_net -p uc_client -p uc_node
          -p uc_service -p uc_remote -p uc_gateway -p uc_ctl
      # The 5 leaves (no path dependencies of their own: uc_journal,
      # uc_protocol, uc_obs, uc_remote, uc_consensus) are the only crates that can
      # be `cargo publish --dry-run`'d before anything is actually on
      # crates.io — every other crate's path deps can't resolve from the
      # real registry yet. The real, sequential, manual publish order for a
      # release is `docs/how-to/cut-a-release.md` (M12c Task 4); this job
      # only smoke-tests that packaging itself still works.
      - name: cargo publish --dry-run (the 5 dependency-free leaves)
        run: |
          cargo publish --dry-run -p uc_journal
          cargo publish --dry-run -p uc_protocol
          cargo publish --dry-run -p uc_obs
          cargo publish --dry-run -p uc_remote
          cargo publish --dry-run -p uc_consensus
