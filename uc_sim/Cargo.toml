[package]
name = "uc_sim"
description = "UC v2 deterministic election simulation (spec §8 L1): one thread, virtual time, seeded faults + injected crashes; the five safety invariants checked after every event. Gates the networked election (uc_net) — must be green first."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
# Simulation harness, not part of the published DAG (M12c ruling).
publish = false

[features]
# Heavy fuzz tier (1000 seeds, 5-node mix): a CI knob, run in --release.
sim-heavy = []
# Test-only helpers (e.g. `World::test_only_park_violation`) that must not be
# part of the shipped public surface. Enabled for this crate's own tests via the
# self dev-dependency below (so default `cargo test` keeps working); never on for
# `cargo build`. Post-M7 loose-end (4).
test-support = []
# The consensus crate's mutation teeth (elle tier), reachable from the sim so a
# directed scenario can carry a RED twin against the shipped kernel (e.g. the
# pre-2026-08-16 index-aligned reconcile). Never on by default.
mutation-testing = ["uc_consensus/mutation-testing"]

[dependencies]
uc_consensus = { path = "../uc_consensus", version = "2.10.0" }
# T13: crypto-plane sim coverage (Peers/GroupPlane are pure (input, now_ns) ->
# Vec<Action> transition functions with no sockets/clock reads, so the world
# can drive them exactly like ElectionSm). uc_protocol/base64 are only needed
# to name the handshake datagram kinds and format the sim's own on-disk
# allowlist fixture.
uc_crypto = { path = "../uc_crypto", version = "2.10.0" }
uc_protocol = { path = "../uc_protocol", version = "2.10.0" }
base64 = { workspace = true }

[dev-dependencies]
# Self dev-dependency turns on `test-support` for the integration tests
# (tests/scenarios.rs) without requiring `--features test-support` on every
# `cargo test`. Standard idiom for a test-only pub API used by an integration
# test (rust-lang/cargo#2911). Dev-only: does not affect `cargo build`.
uc_sim = { path = ".", features = ["test-support"] }
