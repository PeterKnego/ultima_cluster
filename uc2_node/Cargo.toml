[package]
name = "uc2_node"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
uc_protocol = { path = "../uc_protocol" }
uc2_log = { path = "../uc2_log" }
uc2_net = { path = "../uc2_net" }
uc2_consensus = { path = "../uc2_consensus" }
ultima-journal = { workspace = true }
thiserror = { workspace = true }
fs2 = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
# Dev-only cycle (permitted: every edge is a dev-dependency) — the Task 11
# barrier test drives the full read path with a real service + client.
uc2_service = { path = "../uc2_service" }
uc2_client = { path = "../uc2_client" }
# L3 lincheck port (Task 13): the WGL checker/history/model + CAS-register SM,
# built for the v2 SDK trait only (v1 `uc_service` is not pulled in here).
uc-lincheck = { path = "../uc-lincheck", default-features = false, features = ["v2"] }
serde = { workspace = true }
bincode = { workspace = true }
tempfile = { workspace = true }
rand = { workspace = true }
# m5_gate (Task 15): CLI parsing, latency histogram, error plumbing for the
# node/service reference-binary roles.
clap = { workspace = true }
hdrhistogram = { workspace = true }
anyhow = { workspace = true }
