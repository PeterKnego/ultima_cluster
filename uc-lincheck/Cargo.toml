[package]
name = "uc-lincheck"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[features]
# `v2` binds `RegisterSm: uc2_service::StateMachine` for the L3 lincheck port.
# (The v1 feature was retired with the v1 stack; v2 is now the only impl.)
default = ["v2"]
v2 = ["dep:uc2_service"]

[dependencies]
uc2_service = { path = "../uc2_service", optional = true }
serde       = { workspace = true }
bincode     = { workspace = true }
