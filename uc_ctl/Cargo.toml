[package]
name = "uc_ctl"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Admin CLI for live ultima_cluster reconfiguration"

# The package is `uc_ctl` (uniform `uc_` prefix on crates.io); the BINARY stays
# `uc2ctl` — it is the operator-facing name baked into systemd units, the
# container image, compose healthchecks and every runbook, so it is not a
# package-naming decision to make. Declared explicitly because a `src/main.rs`
# would otherwise take the package's name.
[[bin]]
name = "uc2ctl"
path = "src/main.rs"

# Deliberately its own crate rather than a bin inside `uc_node`: uc2ctl talks
# to a running node purely through the cnc page's admin slots, so the live
# reconfiguration verbs need only `uc_log` and `uc_protocol`, not `uc_node`
# itself — that split is what keeps `clap` off the node library's dependency
# graph for every consumer. M11 Task 2's `backup`/`verify-backup`/`restore`
# verbs are the one exception: they are OFFLINE (filesystem-only, no cnc
# admin-band interaction at all — see `uc_node::backup`'s module doc) and
# reuse that module's `backup_instance`/`verify_artifact`/`restore_artifact`
# rather than reimplementing them here, so `uc_node` becomes a dependency
# for THOSE three verbs specifically.
[dependencies]
uc_log = { path = "../uc_log", version = "2.13.0" }
uc_node = { path = "../uc_node", version = "2.13.0" }
uc_protocol = { path = "../uc_protocol", version = "2.13.0" }
# M12b Task 6: `--admin-key` signing + `gen-admin-key` — the canonical
# `AdminMessage`/`sign`/`AdminKey`/`generate_key_file` live here so this CLI
# builds the exact same byte layout the node verifies, rather than
# reimplementing it.
uc_crypto = { path = "../uc_crypto", version = "2.13.0" }
clap = { workspace = true }
anyhow = { workspace = true }
# A per-request nonce, so a response can never be mistaken for a stale one.
rand = { workspace = true }
# `schedule apply`: the operator's TOML file (spec §5) -> `ScheduleTable`.
# Same crate + version `uc_node::config_file` already parses `node.toml` with.
toml = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# `tier export-corpus` writes the diff-replay `CORPUS` manifest with the
# harness's own writer (`CorpusManifest::write`), so the format has one
# author. `default-features = false`: no `export`/`pin-verify`, so no node
# spawning and no second path to `uc_node` (already a dependency above).
# Acyclic: `uc_diffreplay` never depends on `uc_ctl`, and it publishes
# before `uc_ctl` (`docs/how-to/cut-a-release.md` §6).
uc_diffreplay = { path = "../uc_diffreplay", version = "2.13.0", default-features = false }

[dev-dependencies]
# admin_auth_bin.rs starts a real node IN-PROCESS (uc_node is already a
# regular dependency above) and needs `FaultConfig` for `NodeConfig`.
uc_net = { path = "../uc_net", version = "2.13.0" }
# snapshot_bin.rs starts a real snapshot-CAPABLE service alongside the
# in-process node (coordinated-snapshot plan 2 Task 7), the same fixture
# shape `uc_node/tests/learner.rs`'s `SumSm` uses.
uc_service = { path = "../uc_service", version = "2.13.0" }
tempfile = { workspace = true }
# tier_bin.rs: the kv example is the diff-replay subject of `tier
# export-corpus`'s end-to-end test (its `KvSm` fills the tier in process; the
# `kv-service` binary replays the corpus). `publish = false` crate, so no
# `version =` — cargo strips an unversioned path dev-dependency on package.
kv_store = { path = "../examples/kv" }
# tier_bin.rs submits the kv commands over the real shmem path (`Engine`,
# the bytes-level client), as `kv_store`'s own corpus generator does.
uc_client = { path = "../uc_client", version = "2.13.0" }
