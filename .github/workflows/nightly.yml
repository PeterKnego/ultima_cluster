name: nightly

# The full proof suite — everything ci.yml deliberately skips. One job per
# proof family so a slow capstone doesn't hide a loom/crashtest failure and
# each gets its own timeout:
#   * capstones  — the whole workspace test suite INCLUDING uc_node's WGL
#                  lincheck capstones (lin_v2: failover + purge/snapshot-churn
#                  linearizability; lin_partition_v2: partition / quorum-loss)
#                  Since 2.8.1
#                  each of those has a TWO-FSM twin (lin_v2's two_fsm_*,
#                  lin_partition_v2's minority_partition_and_heal_two_fsm),
#                  picked up by `cargo test --workspace` with no matrix change.
#   * sim-heavy  — uc_sim's 1000-seed election/truncation fuzz tier.
#   * loom       — the uc_log frame-visibility memory model AND the
#                  uc_protocol MPSC ring commit protocol (M13a: claim/commit
#                  CAS, skip-marker race, head-of-line at a hole; exhaustive
#                  interleaving exploration; needs `--cfg loom` + release).
#   * crashtest  — multi-process SIGKILL-mid-load linearizability
#                  (uc_crashtest bins spawned via CARGO_BIN_EXE_*), including
#                  the 2.8.1 two-FSM scenarios (two_fsm_service_sigkill,
#                  two_fsm_node_sigkill) — same feature flag, no matrix change.
#   * quickstart — packaging/quickstart-local.sh run for real: three nodes,
#                  three services, three gateways and a remote client, driven
#                  from a bin dir that holds nothing but the five shipped
#                  binaries. The "no toolchain" adoption path (M12c), which
#                  release.yml's release-smoke job runs against the actual
#                  tarball — this job keeps it honest between tags.
#   * fuzz       — M12d: libFuzzer over every decoder that sees bytes it did
#                  not write (fuzz/README.md's target table), 600 s per
#                  target, four matrix legs gated by `fuzz-groups` so a new
#                  target can never be silently left unfuzzed. Nightly
#                  toolchain; the fuzz crate is outside the workspace.
#   * miri       — M12d: UB detection over the PURE decoders only
#                  (uc_protocol's v2 wire/cnc/ipc layer, uc_journal's
#                  record/stable_value decoders). The IPC rings are excluded
#                  and cannot be included — Miri does not support file-backed
#                  memory mappings; see the job comment and VERIFICATION.md.
#   * crashtest-crypto / elle-crypto — M8 Task 15: the crashtest and elle
#                  clean tiers re-run with UC2_CRYPTO=1 (wire crypto Enabled
#                  on every spawned node). The lincheck crypto variants
#                  (lin_v2/lin_partition_v2's *_with_crypto tests) need no
#                  separate job — `cargo test --workspace` in `capstones`
#                  picks them up automatically. These two do, because
#                  UC2_CRYPTO is an opt-in env switch the plain `crashtest`/
#                  `elle` jobs never set.
# Runners are small (4 vCPU) vs the dev fleet; the capstones spin multi-node
# clusters of busy-polling agents, hence the generous timeouts. A red run here
# with a green ci.yml usually means a timing-sensitive capstone, not a logic
# regression — reproduce locally before reverting anything.

on:
  schedule:
    - cron: '17 3 * * *' # daily 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  capstones:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # lin_v2's reconfig-churn capstone runs a 4th busy-spin node + widened
      # election timeouts on top of the other capstones' load; its
      # env-tunable wall-clock budget (default 120s, see lin_v2.rs) is
      # widened here so it doesn't blow the wall on this runner's 4 vCPUs.
      UC2_LIN_BUDGET_SECS: 240
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Full workspace tests (incl. lin_v2 + lin_partition_v2)
        run: cargo test --workspace

  sim-heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Seeded heavy fuzz (1000-seed election/truncation)
        run: cargo test -p uc_sim --features sim-heavy
      # The window-slide red twin needs uc_consensus's mutation tooth (the
      # pre-2026-08-16 index-aligned reconcile); it must keep FINDING wipes.
      - name: Window-slide red twin (mutation tooth must bite)
        run: cargo test -p uc_sim --features mutation-testing --test scenarios window_slide

  loom:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Frame-visibility loom model
        run: cargo test -p uc_log --test loom_frame --release
        env:
          RUSTFLAGS: --cfg loom
      - name: MPSC ring commit-protocol loom model
        run: cargo test -p uc_protocol --test loom_mpsc --release
        env:
          RUSTFLAGS: --cfg loom

  crashtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Multi-process SIGKILL linearizability
        run: cargo test -p uc_crashtest --features hard-crash-tests

  # M12c: the binary quickstart. Feature-gated out of the default `cargo test`
  # because it starts eleven processes and waits on an election; fixed ports
  # (UDP 9100-9102, TCP 9200-9202) mean it wants a runner to itself, which is
  # what a separate job gives it.
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: packaging/quickstart-local.sh, end to end
        run: cargo test -p counter --features quickstart-tests --test quickstart_local -- --nocapture

  # M8 Task 15: the same suite with wire crypto Enabled on every node the
  # crashtest bins spawn (UC2_CRYPTO=1 — see examples/uc_crashtest/tests/
  # common/mod.rs). A separate job (not a matrix leg on `crashtest`) so a
  # crypto-specific regression is never conflated with a cleartext one, same
  # rationale as every other split in this file.
  crashtest-crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UC2_CRYPTO: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Multi-process SIGKILL linearizability (crypto ON)
        run: cargo test -p uc_crashtest --features hard-crash-tests

  # M11 Task 3: the spec's acceptance sentence as a CI test — a node is
  # backed up under load, its host destroyed, a new host restored from the
  # backup alone, and it rejoins and converges. Real multi-process (3 node +
  # service pairs), real SIGKILL, real filesystem `rm -rf`. Mirrors
  # `crashtest`'s shape.
  survival:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # `--test-threads=1`: each test in this multi-process suite boots a
      # real 3-node cluster (node + service pairs); the default runner
      # parallelism would run several of those concurrently on a 4-vCPU
      # runner, competing for the same cores the busy-spin polling agents
      # need (see `uc_node/tests/backup.rs`'s `serialize()` for the same
      # oversubscription failure mode observed there).
      - name: Backup under load -> host destroyed -> restore -> rejoin
        run: cargo test -p uc_crashtest --features survival-tests -- --test-threads=1
      # M11 Task 6: ENOSPC asserted end-to-end. A 64 MiB loopback ext4
      # filesystem (scripts/enospc_fixture.sh) needs sudo for mkfs/mount/
      # chown, which ubuntu-latest has (unlike the dev box this was
      # authored on -- see the fixture script's `sudo -n true` probe and
      # examples/uc_crashtest/tests/enospc.rs's module doc). The sudo-free
      # `write_denied_drives_the_same_failstop_chain` sibling in the same
      # test file runs unconditionally once the feature is on, with or
      # without the fixture step below.
      - name: Create the ENOSPC loopback fixture
        run: scripts/enospc_fixture.sh create /home/runner/uc2-enospc-test 64
      - name: ENOSPC fail-stop asserted; cluster survives; recovers on space return
        run: cargo test -p uc_crashtest --features enospc-tests -- --test-threads=1
        env:
          UC2_ENOSPC_DIR: /home/runner/uc2-enospc-test
      - name: Destroy the ENOSPC loopback fixture
        if: always()
        run: scripts/enospc_fixture.sh destroy /home/runner/uc2-enospc-test

  # Elle transactional-safety tier: 6 list-append passes (quiet/failover/
  # partition/purge/reconfig/quiet_two_fsm), each adjudicated by the vendored
  # elle-cli under `serializable` AND `strong-serializable` — anomaly set must be
  # empty. `quiet_two_fsm` (M14c2, 2.8.1) runs a two-FSM cluster and writes ONE
  # HISTORY PER FSM under `quiet_two_fsm/fsm{0,1}/`; elle_check.sh adjudicates
  # each separately, so its FAIL lines name the FSM. No matrix change was needed
  # to pick it up — it is in the script's default pass list. The jar is vendored
  # (nothing downloads); jq ships on ubuntu-latest. Reduced op sizing keeps
  # elle-cli's cycle search clear of `unknown` verdicts on a 4-vCPU runner.
  elle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ELLE_TARGET_OPS: 8000
      ELLE_BUDGET_SECS: 300
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Elle clean tier (6 passes, both consistency models)
        run: scripts/elle_check.sh

  # M8 Task 15: the same 6-pass clean tier with wire crypto Enabled on every
  # node (UC2_CRYPTO=1 — see uc_node/tests/elle_v2.rs's crypto_from_env).
  # A dedicated ELLE_DIR: CI runners are ephemeral (no cross-job reuse), but
  # naming it explicitly keeps the crypto/cleartext histories unambiguous in
  # any artifact upload and matches `scripts/elle_check.sh`'s own posture
  # sidecar check (a mismatched ELLE_DIR now fails loudly rather than
  # silently adjudicating the wrong posture).
  elle-crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ELLE_TARGET_OPS: 8000
      ELLE_BUDGET_SECS: 300
      ELLE_DIR: /home/runner/.cache/uc2-elle-crypto
      UC2_CRYPTO: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Elle clean tier, crypto ON (6 passes, both consistency models)
        run: scripts/elle_check.sh

  # Lean proofs gate (Phase 1): builds the sorry-free Uc2Model/Uc2Proofs
  # kernels (commit tracker, reconcile, vote-freshness), then cross-checks
  # the model against real Rust output via a 100k-vector conformance replay
  # (uc_consensus's conform_gen -> `lake exe conform`). See
  # docs/benchmarks/uc2-lean-gate-2026-07-16.md and docs/ops/uc2-runbook.md
  # §9 for the "changing a proved kernel" procedure.
  lean-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch mathlib cache
        working-directory: proofs
        run: lake exe cache get
      - name: Build proofs (sorry-free)
        working-directory: proofs
        run: |
          lake build
          test -d Uc2Model && test -d Uc2Proofs && test -d Conform
          ! grep -rn --include='*.lean' -w 'sorry' Uc2Model Uc2Proofs Conform
      - uses: Swatinem/rust-cache@v2
      - name: Conformance replay (100k vectors)
        run: |
          cargo run -p uc_consensus --release --example conform_gen -- \
            --out "$HOME/.cache/uc2-conform/vectors.jsonl" --count 100000 --seed "$(date +%Y%m%d)"
          cd proofs && lake exe conform "$HOME/.cache/uc2-conform/vectors.jsonl"

  # M12d: the four fuzz matrix legs are declared HERE, once, and this job
  # asserts their union is exactly the set of fuzz targets declared in
  # fuzz/Cargo.toml. Adding a 15th [[bin]] without assigning it to a group
  # fails the workflow here, in ~10 seconds, before any sanitizer build —
  # which is the only way "every target is fuzzed nightly" stays true. No
  # toolchain needed: it reads the manifest, it does not build it.
  fuzz-groups:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
      all: ${{ steps.groups.outputs.all }}
    steps:
      - uses: actions/checkout@v5
      - name: Declare the groups and check them against fuzz/Cargo.toml
        id: groups
        env:
          # One line per matrix leg. Budget: 600 s per target, so keep legs
          # at four targets or fewer to stay inside the 60-minute job timeout.
          FUZZ_GROUPS: |
            uc_protocol_datagram uc_protocol_log_frame uc_protocol_cnc uc_remote_frame
            uc_crypto_open uc_crypto_handshake uc_crypto_group_key uc_crypto_admin
            uc_journal_record uc_journal_stable_value uc_service_session ring_mpsc_record
            uc_node_toml uc_gateway_toml uc_node_http
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys

          groups = [ln.split() for ln in os.environ["FUZZ_GROUPS"].splitlines() if ln.strip()]
          flat = [t for g in groups for t in g]

          # `seed-corpus` is the corpus GENERATOR bin, not a fuzz target
          # (scripts/fuzz_smoke.sh skips it too).
          manifest = open("fuzz/Cargo.toml").read()
          targets = [n for n in re.findall(r'^name = "(.+)"$', manifest, re.M)
                     if n not in ("uc_fuzz", "seed-corpus")]

          dupes = sorted({t for t in flat if flat.count(t) > 1})
          if dupes:
              sys.exit(f"FUZZ GROUPING: target(s) in more than one group: {dupes}")

          ungrouped = sorted(set(targets) - set(flat))
          if ungrouped:
              sys.exit("FUZZ GROUPING: fuzz/Cargo.toml declares target(s) that no matrix "
                       f"group runs: {ungrouped}. Add them to FUZZ_GROUPS in nightly.yml.")

          stale = sorted(set(flat) - set(targets))
          if stale:
              sys.exit("FUZZ GROUPING: a matrix group names target(s) that fuzz/Cargo.toml "
                       f"does not declare: {stale}.")

          print(f"{len(targets)} targets in {len(groups)} groups", file=sys.stderr)
          print("groups=" + json.dumps([" ".join(g) for g in groups]))
          print("all=" + " ".join(sorted(targets)))
          PY

  # M12d: coverage-guided fuzzing of every decoder that sees bytes it did not
  # write — the pre-auth UDP datagram path, the crypto handshake/AEAD framing,
  # the remote/gateway TCP frame, the on-disk journal artifacts, the config
  # parsers and the unauthenticated /metrics HTTP request line. fuzz/README.md
  # is the target table. Runs on nightly (libfuzzer-sys needs -Z sanitizer);
  # the fuzz crate is deliberately outside the workspace, so the workspace
  # itself stays on the pinned stable. A crash uploads fuzz/artifacts and
  # fails the leg. 600 s per target on the committed corpus: this is a
  # regression gate ("no new crash from this corpus in that budget"), not a
  # bug hunt — real hunting is a long local `cargo fuzz run`.
  fuzz:
    needs: fuzz-groups
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.fuzz-groups.outputs.groups) }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          # `shared-key`, not `key`: all four matrix legs build the SAME
          # sanitizer artifacts, so they share one ~500 MB cache entry instead
          # of writing four and LRU-evicting the other nightly jobs' caches.
          shared-key: fuzz
      - name: Install cargo-fuzz
        # Explicit `+nightly`: rust-toolchain.toml pins stable 1.96.0 for this
        # directory, and without the override rustup would download that whole
        # toolchain just to build a host tool this job never uses it for.
        run: cargo +nightly install cargo-fuzz --locked --version 0.13.2
      - name: cargo fuzz list agrees with the declared groups
        # fuzz-groups checked the manifest; this checks what cargo-fuzz
        # actually enumerates, which is the list the smoke script would use
        # with no target arguments. Belt and braces, ~1 s.
        env:
          FUZZ_ALL: ${{ needs.fuzz-groups.outputs.all }}
        run: |
          set -euo pipefail
          cd fuzz
          cargo +nightly fuzz list | grep -v '^seed-corpus$' | sort > "$RUNNER_TEMP/listed.txt"
          printf '%s\n' $FUZZ_ALL | sort > "$RUNNER_TEMP/grouped.txt"
          if ! diff -u "$RUNNER_TEMP/grouped.txt" "$RUNNER_TEMP/listed.txt"; then
            echo "FUZZ GROUPING: 'cargo fuzz list' and nightly.yml's FUZZ_GROUPS disagree (diff above)."
            exit 1
          fi
      - name: Fuzz (600 s per target, >=10 000 runs each)
        # --min-runs is not paranoia. A target can build, run, print a clean
        # line and exit 0 having executed ~16 inputs: llvm-symbolizer stalling
        # on 27 MB of debug info did exactly that to four of these targets
        # (fixed with -print_funcs=0, see scripts/fuzz_smoke.sh). 10 000 is
        # three to five orders of magnitude below what a healthy target does
        # in 600 s, so it flags a stalled run without flaking on a slow runner.
        env:
          FUZZ_GROUP: ${{ matrix.group }}
        run: scripts/fuzz_smoke.sh --min-runs 10000 600 $FUZZ_GROUP
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts-${{ strategy.job-index }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  # M12d: Miri (UB detection under a symbolic interpreter) over the PURE
  # decoders only — uc_protocol's v2 wire/cnc/ipc layer and version packing,
  # and uc_journal's segment/stable_value record decoders. These are the
  # surfaces the fuzz targets drive, so Miri and libFuzzer cover the same
  # code from two directions: libFuzzer finds inputs that panic, Miri finds
  # UB on inputs that do not.
  #
  # The IPC ring buffers are deliberately NOT here. They are file-backed
  # shared memory, and Miri cannot model that at any setting:
  #   * with isolation on (the default):
  #       unsupported operation: `open` not available when isolation is enabled
  #   * with -Zmiri-disable-isolation, it gets one step further and stops on
  #       unsupported operation: unsupported flags for `fallocate` in `mode`
  #       argument: 16                                 (FALLOC_FL_ZERO_RANGE)
  #   * and past that it would stop regardless, on
  #       unsupported operation: Miri does not support file-backed memory
  #       mappings
  # A Vec-backed ring variant built purely for Miri is the stated fallback;
  # it is NOT built, because it would check a different object than the one
  # that ships. The rings' concurrency is covered by loom instead (see the
  # `loom` job) and their layout by offset-pin tests. docs/VERIFICATION.md
  # says this out loud rather than implying the rings are Miri-clean.
  #
  # uc_remote's outgoing/completion/slots ARE here: those SPSC structures
  # are raw pointers over a heap Vec (not file-backed), so Miri models them
  # fully — and it found a real Stacked-Borrows aliasing bug in them during
  # M13b (a whole-buffer &mut retagging the allocation). This is the
  # Vec-backed case the note above leaves unbuilt for the IPC rings; for the
  # remote client it exists for free, so it is checked.
  #
  # Test selection is by filter, and every selected test was run locally
  # under Miri first: all 43 + 19 + 29 pass with isolation ON, so nothing here
  # needed excluding and isolation is never disabled.
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          # rust-src: Miri needs a source-built std (`cargo miri setup`).
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri
      - name: cargo miri setup
        run: cargo +nightly miri setup
      # Explicit `+nightly` (not plain `cargo`) so this genuinely runs on
      # nightly rather than being redirected by rust-toolchain.toml's
      # directory override — same reason ci.yml's msrv job spells it out.
      - name: Miri — uc_protocol wire/cnc/ipc decoders (43 tests)
        run: |
          cargo +nightly miri test -p uc_protocol --lib -- v2:: version::
      - name: Miri — uc_journal record/stable_value decoders (19 tests)
        run: |
          cargo +nightly miri test -p uc_journal --lib -- \
            stable_value::tests:: error::tests:: \
            journal::segment::tests::header_ \
            journal::segment::tests::record_ \
            journal::segment::tests::decode_
      - name: Miri — uc_remote SPSC structures (outgoing/completion/slots, 29 tests)
        run: |
          cargo +nightly miri test -p uc_remote --lib -- \
            outgoing:: completion:: slots::
