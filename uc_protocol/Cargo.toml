[package]
name = "uc_protocol"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
description = "ultima_cluster wire protocol — shared-memory layouts, frames, versions"

[dependencies]
# M3: ring buffer primitives need std (atomics + mmap). Pure data types
# (version, magic, error_codes) remain core-only-compatible.
memmap2 = { workspace = true }
parking_lot = { workspace = true }
page_size = { workspace = true }
thiserror = { workspace = true }
crc32fast = { workspace = true }
# M5: OutputError (output.rs) needs serde for wire encoding
serde = { workspace = true }
bincode = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
