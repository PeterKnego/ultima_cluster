[package]
name = "uc2_sim"
description = "UC v2 deterministic election simulation (spec §8 L1): one thread, virtual time, seeded faults + injected crashes; the five safety invariants checked after every event. Gates the networked election (uc2_net) — must be green first."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Heavy fuzz tier (1000 seeds, 5-node mix): a CI knob, run in --release.
sim-heavy = []

[dependencies]
uc2_consensus = { path = "../uc2_consensus" }
