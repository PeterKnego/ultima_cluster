[package]
name = "counter"
description = "The counter-service tutorial app: single-process and multi-process (node/service/client) binaries built on the ultima_cluster SDK"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

# The whole cluster in one process — the hello-world.
[[bin]]
name = "counter-single"
path = "src/bin/counter-single.rs"

# The three process roles, for running a real multi-node cluster locally.
[[bin]]
name = "counter-node"
path = "src/bin/counter-node.rs"

[[bin]]
name = "counter-service"
path = "src/bin/counter-service.rs"

[[bin]]
name = "counter-client"
path = "src/bin/counter-client.rs"

# The remote twin of counter-client: talks TCP to a uc2-gateway instead of
# shared memory to a co-located node. Also the binary packaging/
# quickstart-local.sh drives.
[[bin]]
name = "counter-remote"
path = "src/bin/counter-remote.rs"

[features]
# packaging/quickstart-local.sh, run for real: eleven processes and two
# elections' worth of wall clock, so it is opt-in and lives in nightly.yml's
# `quickstart` job rather than in the default `cargo test`.
quickstart-tests = []

[dependencies]
uc2_node      = { path = "../../uc2_node", version = "2.6.0" }
uc2_service   = { path = "../../uc2_service", version = "2.6.0" }
uc2_client    = { path = "../../uc2_client", version = "2.6.0" }
uc2_net       = { path = "../../uc2_net", version = "2.6.0" }
uc2_consensus = { path = "../../uc2_consensus", version = "2.6.0" }
uc2_remote    = { path = "../../uc2_remote", version = "2.6.0" }
serde         = { workspace = true }
bincode       = { workspace = true }
clap          = { version = "4", features = ["derive"] }
anyhow        = { workspace = true }
tempfile      = { workspace = true }
signal-hook   = { workspace = true }

[dev-dependencies]
libc          = { workspace = true }
