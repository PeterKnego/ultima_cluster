[package]
name = "uc_node"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
description = "ultima_cluster engine — Raft, journal, network (M1: embedded only)"

[dependencies]
serde = { workspace = true }
bincode = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
openraft = { workspace = true }
openraft-legacy = { workspace = true }
ultima-journal = { workspace = true }
uc_protocol = { path = "../uc_protocol" }
uc_service = { path = "../uc_service" }
quinn = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
rustls-pemfile = { workspace = true }
crc32fast = "1"
core_affinity = "0.8"
# M3 — shmem IPC
memmap2 = { workspace = true }
fs2 = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
# `test-support` fixture deps (optional; enabled by the feature).
uc_client = { path = "../uc_client", optional = true }
tempfile = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

[dev-dependencies]
uc_node = { path = ".", features = ["test-helpers", "test-support"] }
uc_client = { path = "../uc_client", features = ["test-helpers"] }
tempfile = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
# Needed by m3_ultima_db_adapter test (constructs ultima_db::Store directly).
ultima-db = { workspace = true }
uc-lincheck = { path = "../uc-lincheck" }

[features]
test-helpers = []
# Reusable in-process node+service+client fixtures (see src/test_support.rs).
# Used by uc_node's own M4 integration tests and by the uc_autobench shmem-e2e binary.
test-support = ["dep:uc_client", "dep:tempfile", "dep:anyhow"]
# Test-only in-process network fault injection (partition / quorum-loss).
# Off by default: zero production surface. Enable for partition tests:
#   cargo test -p uc_node --features fault-injection
fault-injection = []
