[package]
name = "counter_loop"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "counter_loop_service"
path = "src/bin/counter_loop_service.rs"

[[bin]]
name = "counter_loop_client"
path = "src/bin/counter_loop_client.rs"

[dependencies]
uc_protocol = { path = "../../uc_protocol" }
uc_node     = { path = "../../uc_node" }
uc_service  = { path = "../../uc_service" }
uc_client   = { path = "../../uc_client" }
ultima-db   = { workspace = true }

serde       = { workspace = true }
bincode     = { workspace = true }
tokio       = { workspace = true }
async-trait = { workspace = true }
futures     = { workspace = true }
parking_lot = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow      = { workspace = true }
rand        = { workspace = true }
thiserror   = { workspace = true }

clap         = { version = "4", features = ["derive"] }
tonic        = "0.12"
prost        = "0.13"
tokio-stream = { version = "0.1", features = ["sync"] }
hdrhistogram = "7"

[build-dependencies]
tonic-build = "0.12"
