groups:
- name: uc2
  interval: 15s
  rules:
  - alert: Uc2AgentDead
    expr: uc2_agent_alive == 0
    for: 0m
    labels: { severity: critical }
    annotations: { summary: "agent {{ $labels.agent }} fail-stopped on {{ $labels.instance }}" }
  - alert: Uc2NoLeader
    expr: max(uc2_is_leader) == 0
    for: 30s
    labels: { severity: critical }
    annotations: { summary: "no node reports leadership — election cannot complete" }
  - alert: Uc2LeaderNotServing
    expr: uc2_is_leader == 1 and uc2_can_serve == 0
    for: 30s
    labels: { severity: critical }
    annotations: { summary: "{{ $labels.instance }} elected but its NewTerm frame is not quorum-committed (flags 0x01)" }
  - alert: Uc2ServiceWedged
    expr: uc_service_heartbeat_age_seconds{service=""} > 5 and uc_node_heartbeat_age_seconds < 3
    for: 1m
    labels: { severity: critical }
    annotations: { summary: "apply loop wedged on {{ $labels.instance }}: node alive, service heartbeat stale" }
  - alert: Uc2ReplicationStalled
    expr: delta(uc2_commit_bytes[1m]) == 0 and delta(uc2_append_bytes[1m]) > 0
    for: 1m
    labels: { severity: critical }
    annotations: { summary: "{{ $labels.instance }} appends but cannot commit — no quorum acknowledging" }
  - alert: Uc2PeerNeverHeard
    # The peer band is leader-authoritative: reported_durable is only fed by
    # AppendPosition reports, which only the LEADER receives, so a follower's
    # own scrape always reads 0 for every peer — that's not "never heard",
    # it's "not the leader". Scope to the leader's own view.
    expr: uc2_peer_reported_durable_bytes == 0 and on(instance) uc2_is_leader == 1
    for: 2m
    labels: { severity: warning }
    annotations: { summary: "peer {{ $labels.peer }} has never reported — check the bind-address rule first" }
  - alert: Uc2PeerLagging
    # Same leader-scoping as Uc2PeerNeverHeard above — a follower's
    # uc2_peer_replication_lag_bytes is commit - 0 (it never tracks peers'
    # reported_durable), so without this the rule would false-fire on every
    # healthy follower under sustained traffic.
    expr: (uc2_peer_replication_lag_bytes > on(instance) group_left uc2_admission_bytes) and on(instance) uc2_is_leader == 1
    for: 5m
    labels: { severity: warning }
    annotations: { summary: "peer {{ $labels.peer }} lags by more than the admission window" }
  - alert: Uc2AdmissionSaturated
    expr: uc2_admission_saturation > 0.9
    for: 1m
    labels: { severity: warning }
    annotations: { summary: "ingress admission window ≥90% consumed on {{ $labels.instance }} — commit is not keeping up with append" }
  - alert: Uc2PurgeStalled
    expr: uc2_purge_enabled == 1 and (uc_node_snapshot_floor_bytes - uc2_archive_first_base_bytes) > 2 * uc2_journal_segment_bytes
    for: 10m
    labels: { severity: warning }
    annotations: { summary: "purge enabled but the journal head lags the snapshot floor by >2 segments on {{ $labels.instance }}" }
  - alert: Uc2RepeatedWipes
    expr: delta(uc2_wipes_total[10m]) > 1
    for: 0m
    labels: { severity: warning }
    annotations: { summary: "{{ $labels.instance }} wiped-and-rejoined more than once in 10m" }
  - alert: Uc2UnattestedReports
    expr: delta(uc2_reports_unattested_total[5m]) > 0
    for: 0m
    labels: { severity: critical }
    annotations: { summary: "unattested durable reports on {{ $labels.instance }} — a pre-0.5.0 peer is in the cluster; commits will stall (flag-day violation)" }
  - alert: Uc2CleartextPeer
    expr: delta(uc2_cleartext_peer_datagrams_total[5m]) > 0
    for: 0m
    labels: { severity: critical }
    annotations: { summary: "cleartext datagrams from a peer while crypto is on — a node missed the flag day" }
  - alert: Uc2FollowerSealFailures
    expr: delta(uc2_receiver_seal_failures_total[5m]) > 0 and uc2_is_leader == 0
    for: 0m
    labels: { severity: warning }
    annotations: { summary: "outgoing control frames follower {{ $labels.instance }} could not seal — check pairwise sessions/allowlist (a leader's seal_failures climb is benign, this one is not)" }
  - alert: Uc2DiskLow
    expr: uc2_free_disk_bytes < 4 * uc2_journal_segment_bytes
    for: 2m
    labels: { severity: warning }
    annotations: { summary: "{{ $labels.instance }} has less than 4 journal segments of free disk — the archive fail-stops at ENOSPC; purge or grow the disk" }
  - alert: Uc2ServiceAbsent
    # M14c: rendered for every DECLARED id, so an FSM that never started is a
    # 0 sample rather than a missing series — that is what makes it
    # alertable at all. An absent declared FSM holds min(applied) still,
    # which closes the admission door and caps this node's durable report at
    # the lag bound: the cluster stalls by design until it attaches.
    expr: uc_service_attached == 0
    for: 30s
    labels: { severity: critical }
    annotations: { summary: "declared FSM {{ $labels.service }} is not attached on {{ $labels.instance }} — admission is closed and this node's report is capped at the lag bound" }
  - alert: Uc2ServicePinnedAtLagBound
    # Bounded mode only: uc2_fsm_lag_bytes == 0 means lockstep, where being
    # "at the bound" is the normal steady state. `>=` not `>`: the node's own
    # report ceiling caps commit at exactly min(applied) + fsm_lag, so a
    # genuinely pinned FSM sits ON the bound and never past it. The
    # on(instance) group_left join is the same idiom Uc2PeerLagging uses to
    # compare a per-peer series against the node-scalar admission window.
    #
    # Review round 2: gated on the FSM being ATTACHED. A detached FSM's
    # lag climbs to the bound and sits there, so an absent FSM would fire
    # BOTH this and Uc2ServiceAbsent — two pages for one fact, and the
    # wrong one on top (an absent FSM is critical and is not "pacing the
    # cluster", it is gone). `on(instance, service)`: both sides carry
    # the service label here, unlike the node-scalar bound above.
    #
    # M14c2: TOLERANCE for a bound the frame size does not divide. `fsm_lag`
    # is a byte bound and frames are whole, so unless the frame size divides
    # the bound the pinned steady state does not land ON it — the last frame
    # that fits leaves the FSM up to one frame short, `commit - applied`
    # oscillates just BELOW `fsm_lag`, and a `>= fsm_lag` rule goes silent on
    # exactly the FSM an operator is hunting.
    #
    # One EXACT frame is not expressible here: the frame size is
    # `align(32 + max_payload)` and `max_payload` is not exported as a
    # metric, so the rule cannot know it. Two bounds are, and the threshold
    # is the TIGHTER of them — `max(fsm_lag - 1408, 0.9 * fsm_lag)`, written
    # as two `and`-ed clauses because PromQL has no scalar-vector `max`:
    #
    #   - `fsm_lag - 1408`: 1408 is MTU_DEFAULT (uc_protocol::v2::datagram).
    #     A UC frame is one datagram and can never exceed it, so this is an
    #     absolute upper bound on "one frame" for ANY payload size. It is
    #     generous at small bounds (at fsm_lag = 8192 with 128 B frames it
    #     would be 6784 — eleven frames of slack, i.e. an FSM 17 % short of
    #     the bound would page) and can even go negative below 1408.
    #   - `0.9 * fsm_lag`: caps the slack at a tenth of the bound, which is
    #     what actually carries small bounds, and cannot go non-positive.
    #
    # So the slack is at most one MTU OR 10 % of the bound, whichever is
    # tighter. At the gate fixture's 8192-byte bound the relative clause
    # binds: threshold 7372.8 (not 6784), and the fixture's pinned FSM reads
    # 8320. For a bound above ~14 KiB the MTU clause binds instead.
    #
    # `group_left()` — with the empty parens — is required: a bare
    # `group_left (expr)` makes the parser read `(expr)` as the grouping
    # LABEL LIST and fail. Do not drop them.
    expr: (uc_service_lag_bytes >= on(instance) group_left() (uc2_fsm_lag_bytes - 1408)) and (uc_service_lag_bytes >= on(instance) group_left() (uc2_fsm_lag_bytes * 0.9)) and on(instance) uc2_fsm_lag_bytes > 0 and on(instance, service) uc_service_attached == 1
    for: 30s
    labels: { severity: warning }
    annotations: { summary: "FSM {{ $labels.service }} on {{ $labels.instance }} is pinned at the fsm_lag bound — it is pacing the whole cluster" }
  - alert: Uc2LogTimeFrozen
    # Time-and-timers spec §3: `uc2_log_time_lag_seconds` is leader-only
    # (rendered 0 on followers), so the `uc2_is_leader == 1` join picks out
    # the one instance where a nonzero lag is meaningful. A grown lag means
    # either the leader's wall clock stepped backwards (log-time stamps hold
    # at their last value until wall time catches back up) or nothing is
    # being appended at all — either way the log's clock has frozen relative
    # to wall time.
    expr: uc2_log_time_lag_seconds > 5 and on(instance) uc2_is_leader == 1
    for: 30s
    labels: { severity: warning }
    annotations: { summary: "log time on the leader is {{ $value }}s behind wall time — its clock stepped backwards, or the appender is stalled" }
  - alert: Uc2ServiceIdentityDrift
    # Task 7 (spec §4.5): a row's declared NAME must be identical on every
    # node — it is written once at boot (cnc 3.1 line 7) from each node's own
    # `[services]` config, so two nodes disagreeing means they were started
    # against different SM code (or a mis-ordered/mis-edited config) at the
    # same row. SNAP_BEGIN sessions between them are refused by name (a
    # wire-0.7.0 flag-day refusal, not a crash), so a joiner is stuck rather
    # than converging on the wrong FSM.
    #
    # `uc2_service_identity_hash` has no VALUE-shaped label to group on
    # directly, so `count_values` promotes the sample's own value into a
    # fresh label first (one output series per distinct (row, hash) pair);
    # the outer `count by (row)` then counts how many DISTINCT hashes exist
    # for that row across every scraped instance — more than one is drift.
    expr: count by (row) (count_values("hash", uc2_service_identity_hash) by (row)) > 1
    for: 1m
    labels: { severity: critical }
    annotations: { summary: "row {{ $labels.row }} names different FSMs on different nodes — snapshot sessions between them are refused by name" }
  - alert: Uc2ServiceVersionDrift
    # Same `count_values` idiom as Uc2ServiceIdentityDrift, over the packed
    # version word each service last wrote at attach (Task 5). `> 0` first:
    # 0 means "no service has ever attached this slot" (a declared-but-
    # unstarted FSM, or a service built without a `const VERSION`), which is
    # a normal transient state — not a real disagreement to page on. A
    # rolling upgrade holding old and new versions live at once is exactly
    # what this catches.
    expr: count by (row) (count_values("version", uc2_service_version > 0) by (row)) > 1
    for: 5m
    labels: { severity: warning }
    annotations: { summary: "row {{ $labels.row }} runs different FSM versions across nodes" }
  - alert: Uc2ScheduleTableDiverged
    # Cluster-FSM spec §4.3: the replicated schedule table is a record inside
    # the node's own internal cluster FSM, changed by a CLUSTER frame (type 4,
    # kind 2) and applied at COMMIT on every node — so
    # `uc2_schedule_table_position` must hold ONE value fleet-wide. The
    # `count_values` idiom is Uc2ServiceIdentityDrift's: promote the sample's
    # own value into a label (one output series per distinct position), then
    # count how many distinct ones exist. More than one is divergence.
    #
    # This is a NARROW alert since 2.11.0, because the mechanisms that used to
    # make it fire are gone:
    #   * there is no state/schedules.state and no ScheduleRecord, so the
    #     crash-between-recording-and-persisting window is closed — the
    #     uc2-cluster agent replays the journal above its artifact;
    #   * there is no revert-on-truncation and no wipe keep-alive, because an
    #     uncommitted frame is never applied in the first place. The old
    #     "uc2_schedule_entries > 0 with position 0" wipe signature and the
    #     schedule_table_reverted record no longer exist;
    #   * a BELOW-FLOOR JOIN is not a cause. The snapshot session carries the
    #     cluster FSM's own artifact (service_id 255), installed by fiat before
    #     the joiner's purge floor advances, so it holds the cluster's table
    #     before it can serve a read or win an election. There is no ship-time
    #     freshness gate left to get wrong.
    #
    # So a node reading a different position is a node whose uc2-cluster agent
    # is not applying: compare its uc2_schedule_table_position against
    # uc2_commit_bytes on the same node. A node reading 0 while its peers read
    # nonzero has applied no table at all.
    #
    # NOT keyed on uc2_cluster_fsm_position, which spec §9 suggested before
    # Ruling R17 made the cluster FSM's `applied` its apply loop's CURSOR
    # rather than the last CLUSTER command's position. That cursor advances
    # with ordinary traffic, at each node's own pace, so nodes legitimately
    # read different values at any instant and a `count_values` over it would
    # page permanently. `uc2_schedule_table_position` (and, equally,
    # uc2_settings_position) moves only when a CLUSTER command commits, which
    # is the "identical fleet-wide once caught up" property this rule needs.
    # uc2_cluster_fsm_position is still the right gauge for the STALL
    # question, per node, against that node's uc2_commit_bytes.
    #
    # This is a cluster-wide risk, not one node's: only the LEADER appends
    # timer frames, so if the node holding the odd table wins an election,
    # every scheduled recurrence in the cluster stops — every FSM on every node
    # — until an operator re-applies. That is why a warning here is worth
    # paging on rather than watching.
    #
    # Re-run `uc2ctl schedule apply` against the leader: it appends a fresh
    # frame that every node applies.
    expr: count(count_values("p", uc2_schedule_table_position)) > 1
    for: 60s
    labels: { severity: warning }
    annotations: { summary: "nodes disagree on the committed schedule-table position — since 2.11.0 the table is cluster-FSM state applied at commit, so a node at an odd position is a node whose uc2-cluster agent is not applying (compare uc2_schedule_table_position against uc2_commit_bytes on that node); one at 0 has applied no table at all. Only the leader appends timer frames, so if that node wins an election EVERY scheduled recurrence in the cluster stops; re-run `uc2ctl schedule apply`" }
  - alert: Uc2SnapshotStalled
    # Coordinated-snapshot spec §9: `uc2_snapshot_instant_position` (the
    # leader's last COMMANDED instant) and `uc2_snapshot_set_position` (the
    # newest COMPLETE set this node holds) normally advance together, one
    # commanded instant to one completed set. "One broken FSM silently stops
    # all purging" is the failure this rule makes loud: a row that never
    # reaches P (freeze error, too slow, or its service process is dead)
    # leaves the set incomplete forever, and NOTHING downstream fails loudly
    # on its own — the next instant just supersedes the stuck one and the
    # cycle repeats.
    #
    # Expressed as "the instant position has advanced twice while the set
    # position did not" (`changes(...) >= 2` / `== 0` over a 30m window)
    # rather than a plain subtraction, because the two gauges are NOT
    # comparable positions on their own: `uc2_snapshot_instant_position` is
    # leader-local (a follower's reading is stale, whatever it last
    # commanded in some earlier term) while `uc2_snapshot_set_position` is
    # every node's own newest complete set. A `changes()` count sidesteps
    # that — it only asks whether each series is MOVING, on its own
    # instance, which is exactly the "stalled" question.
    #
    # Ruling P10 means a lagging row normally catches up through the
    # journal on its own, so this firing means a row that is not capable,
    # busy forever, or its service process is dead — not ordinary lag.
    # `uc2ctl snapshot show` on the leader lists the newest complete set's
    # position and each row's presence in it; the row missing (or reporting
    # an old `snapshot_pos`) is the one to investigate, and
    # `uc2_snapshot_row_incomplete_total{row}` for it will be climbing.
    expr: changes(uc2_snapshot_instant_position[30m]) >= 2 and changes(uc2_snapshot_set_position[30m]) == 0
    for: 0m
    labels: { severity: warning }
    annotations: { summary: "{{ $labels.instance }} has commanded snapshot instants at least twice in 30m with no complete set landing — one FSM is silently stopping all purging; run `uc2ctl snapshot show` on the leader and look for the row whose snapshot_pos is behind" }
  - alert: Uc2SnapshotSetDiverged
    # Coordinated-snapshot spec §5.3/§9: the newest COMPLETE set's position
    # must agree cluster-wide once every node is caught up — it is the
    # node's purge floor once persisted, so two nodes disagreeing means one
    # has pruned (or will prune) a different prefix than the other. Same
    # count_values idiom as Uc2ScheduleTableDiverged, verbatim, over
    # uc2_snapshot_set_position instead of uc2_schedule_table_position:
    # promote the sample's own value into a label, then count how many
    # distinct ones exist across scraped instances. More than one is
    # divergence.
    expr: count(count_values("p", uc2_snapshot_set_position)) > 1
    for: 60s
    labels: { severity: warning }
    annotations: { summary: "nodes disagree on the newest COMPLETE snapshot set's position — one node's purge floor is at a different point than another's; a node behind is either still catching up (transient) or stuck (check uc2_snapshot_row_incomplete_total and uc2ctl snapshot show on it)" }
