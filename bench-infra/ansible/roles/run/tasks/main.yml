---
# Clean stale cluster state so re-runs start fresh (stale drivers / cluster dirs
# / leftover JVMs would break election or bind ports). Bracket trick on pkill
# ('[i]o.aeron') so the pattern does not match pkill's own shell command line.
- name: Clean stale cluster state
  ansible.builtin.shell: |
    pkill -9 -f '[i]o.aeron' || true
    pkill -9 -f '[u]c-node-launch' || true
    rm -rf /dev/shm/*-driver /dev/shm/uc-* {{ remote_home }}/cluster {{ remote_home }}/uc-data {{ remote_home }}/results
    mkdir -p {{ remote_home }}/results
  changed_when: false

- name: Ensure results dir is owned by the run user
  ansible.builtin.file:
    path: "{{ remote_home }}/results"
    state: directory
    owner: "{{ ansible_user_id }}"
    mode: "0755"

# ---- Aeron: start drivers + nodes on every host, sweep on node0, then tear down ----
- name: Start Aeron media driver
  ansible.builtin.shell: |
    export JAVA_HOME="$(dirname $(dirname $(readlink -f $(which javac))))"
    export JVM_OPTS="-Xms16M"
    setsid {{ aeron_deploy_dir }}/scripts/aeron/media-driver \
      {{ remote_home }}/aeron-cfg/cluster.properties \
      {{ remote_home }}/aeron-cfg/node.properties > {{ remote_home }}/md.out 2>&1 < /dev/null &
  changed_when: false
  when: aeron_enabled | default(true) | bool

- name: Start Aeron cluster node
  ansible.builtin.shell: |
    export JAVA_HOME="$(dirname $(dirname $(readlink -f $(which javac))))"
    export JVM_OPTS="-Xms16M -Dio.aeron.benchmarks.output.directory={{ remote_home }}/results"
    setsid {{ aeron_deploy_dir }}/scripts/aeron/cluster-node \
      {{ remote_home }}/aeron-cfg/cluster.properties \
      {{ remote_home }}/aeron-cfg/node.properties > {{ remote_home }}/node.out 2>&1 < /dev/null &
  changed_when: false
  when: aeron_enabled | default(true) | bool

- name: Wait for cluster election to settle
  ansible.builtin.pause:
    seconds: 20
  run_once: true
  when: aeron_enabled | default(true) | bool

- name: Copy Aeron sweep script to node0
  ansible.builtin.copy:
    src: run_aeron_sweep.sh
    dest: "{{ remote_home }}/run_aeron_sweep.sh"
    mode: "0755"
  when: aeron_enabled | default(true) | bool and node_role == "node0"

- name: Drive Aeron rate ladder (node0)
  ansible.builtin.command: >
    {{ remote_home }}/run_aeron_sweep.sh
    {{ remote_home }}
    {{ rate_ladder | join(',') }}
    {{ payload_bytes }} {{ warmup_seconds }} {{ measure_seconds }}
    {{ batch_size }}
  when: aeron_enabled | default(true) | bool and node_role == "node0"
  changed_when: true

- name: Stop Aeron JVMs
  ansible.builtin.shell: "pkill -9 -f '[i]o.aeron' || true"
  changed_when: false
  failed_when: false
  when: aeron_enabled | default(true) | bool

# ---- UC: start one uc-node per host, sweep on node0, then tear down ----
# Wrap in a block so netem is always removed even if the sweep fails.
- name: Apply netem shaping (when loss or delay > 0)
  ansible.builtin.command: >
    tc qdisc add dev {{ netem_iface }} root netem
    loss {{ netem_loss_pct }}%
    delay {{ netem_delay_ms }}ms
  become: true
  when: netem_loss_pct | int > 0 or netem_delay_ms | int > 0
  changed_when: true

- block:
    - name: Start UC node
      # single_node mode (floor-decomposition): only node0 runs, as a 1-node raft
      # (peer set = just itself) so the e2e latency isolates the no-replication
      # base+fsync layers. Default false = today's full N-node cluster.
      when: (not (single_node | default(false) | bool)) or node_role == "node0"
      ansible.builtin.shell: |
        . {{ remote_home }}/uc-peers.env
        {% if single_node | default(false) | bool %}
        export UC_PEERS="--peer $UC_NODE_ID@$UC_LISTEN"
        {% endif %}
        export UC_DURABILITY={{ 'eventual' if durability == 'none' else 'consistent' }}
        export UC_TRANSPORT={{ transport }}
        export UC_PIPELINE_DEPTH={{ uc_pipeline_depth }}
        export UC_JOURNAL_PREALLOC={{ uc_journal_prealloc }}
        export UC_API_BATCH_LINGER_MS={{ uc_api_batch_linger_ms }}
        export UC_APPLY_SPIN_BUDGET={{ uc_apply_spin_budget }}
        export UC_NODE_BRIDGE_SPIN_BUDGET={{ uc_node_bridge_spin_budget }}
        export UC_LOG_CACHE_BYTES={{ uc_log_cache_bytes }}
        setsid {{ uc_target_bin }}/uc-node-launch \
          --node-id $UC_NODE_ID --listen $UC_LISTEN $UC_PEERS \
          --app-id $UC_APP_ID --with-service \
          --instance-dir /dev/shm/uc-{{ node_role }} \
          --data-dir {{ remote_home }}/uc-data \
          > {{ remote_home }}/uc-node.out 2>&1 < /dev/null &
      changed_when: false

    - name: Wait for UC leader election
      ansible.builtin.pause:
        seconds: 15
      run_once: true

    - name: Copy UC sweep script to node0
      ansible.builtin.copy:
        src: run_uc_sweep.sh
        dest: "{{ remote_home }}/run_uc_sweep.sh"
        mode: "0755"
      when: node_role == "node0"

    # --- leader profiling (task19 throughput follow-up: what saturates at the knee?) ---
    - name: Install perf (best-effort, AWS kernel)
      ansible.builtin.apt:
        name: ["linux-tools-{{ ansible_kernel }}", "linux-tools-aws", "linux-tools-common"]
        state: present
      become: true
      failed_when: false
      when: profile | default(false) | bool and node_role == "node0"

    - name: Start leader profilers in background (node0), then the sweep provides load
      # Backgrounded so they sample DURING the next task (the sustained rung). top -H +
      # ps -T give per-thread %CPU + thread NAMES (maps a hot thread to its role:
      # tokio worker / journal writer / durability consumer / etc.); perf gives the
      # on-CPU function breakdown (best-effort — needs the versioned perf package).
      ansible.builtin.shell: |
        pid=$(pgrep -f '[u]c-node-launch' | head -1)
        echo "leader_pid=$pid kernel=$(uname -r)" > {{ remote_home }}/results/profile_meta.txt
        grep -m1 -iE 'leader|became leader|elected' {{ remote_home }}/uc-node.out >> {{ remote_home }}/results/profile_meta.txt 2>/dev/null || true
        setsid bash -c "top -bH -d 1 -n 45 -p $pid > {{ remote_home }}/results/top_threads.txt 2>&1" </dev/null &
        setsid bash -c "for i in \$(seq 1 45); do ps -T -p $pid -o tid,comm,pcpu --sort=-pcpu 2>/dev/null | head -18; echo ---s\$i---; sleep 1; done > {{ remote_home }}/results/threads.txt 2>&1" </dev/null &
        setsid bash -c "perf record -g --call-graph dwarf -F 199 -p $pid -o {{ remote_home }}/perf.data -- sleep 35 > {{ remote_home }}/results/perf_record.log 2>&1" </dev/null &
        echo "profilers started for pid=$pid"
      become: true
      changed_when: false
      when: profile | default(false) | bool and node_role == "node0"

    - name: Drive UC rate ladder (node0)
      ansible.builtin.command: >
        {{ remote_home }}/run_uc_sweep.sh
        {{ uc_target_bin }}/commit-path-load
        /dev/shm/uc-node0
        {{ uc_app_id }}
        {{ rate_ladder | join(',') }}
        {{ payload_bytes }} {{ inflight }} {{ measure_seconds }}
        {{ warmup_seconds }}
        {{ remote_home }}/results/uc_sweep.csv
        {{ uc_sweep_config | default((1 if (single_node | default(false) | bool) else 3) | string + 'node_' + ('eventual' if durability == 'none' else 'consistent')) }}
      environment:
        # Per-request client timeout (ms). Raise for saturation/overload sweeps so
        # a multi-second tail request isn't reported as a failure (default 10000).
        UC_CLIENT_REQUEST_TIMEOUT_MS: "{{ uc_client_request_timeout_ms | default(10000) }}"
      when: node_role == "node0"
      changed_when: true

    - name: Generate perf report + stage profile artifacts (node0)
      ansible.builtin.shell: |
        sleep 4   # let the backgrounded perf flush perf.data
        if [ -s {{ remote_home }}/perf.data ]; then
          perf report --stdio -i {{ remote_home }}/perf.data --sort overhead,symbol 2>/dev/null | grep -vE '^#' | sed '/^$/d' | head -45 > {{ remote_home }}/results/perf_symbols.txt
          perf report --stdio -g graph,1,caller -i {{ remote_home }}/perf.data 2>/dev/null | head -150 > {{ remote_home }}/results/perf_callgraph.txt
        else
          echo "no perf.data — perf unavailable on this kernel (rely on top_threads.txt / threads.txt)" > {{ remote_home }}/results/perf_symbols.txt
        fi
        # per-thread peak %CPU summary from the top -H series (which thread, if any, pegged a core)
        echo "== per-thread peak %CPU (top -H over the load window) ==" > {{ remote_home }}/results/thread_peak.txt
        awk '/^[ ]*[0-9]/{c=$0; sub(/^[ ]*/,"",c); n=split(c,a," "); cpu=a[9]; name=a[12]; if(cpu+0>m[name]) m[name]=cpu+0} END{for(k in m) printf "%6.1f  %s\n", m[k], k}' {{ remote_home }}/results/top_threads.txt 2>/dev/null | sort -rn | head -20 >> {{ remote_home }}/results/thread_peak.txt || true
      become: true
      changed_when: false
      when: profile | default(false) | bool and node_role == "node0"

    - name: Capture leader replication-RPC probe stats (uc_bench_probes only)
      # The leader emits cumulative REPL_RPC_STATS to uc-node.out every 3s; grab
      # the last line into results/ so collect pulls it. node0 is the bootstrap leader.
      ansible.builtin.shell: >
        grep 'REPL_RPC_STATS' {{ remote_home }}/uc-node.out | tail -1
        > {{ remote_home }}/results/repl_rpc.txt || true
      changed_when: false
      when: node_role == "node0" and (uc_bench_probes | default(false) | bool)

    - name: Stop UC JVMs/procs
      ansible.builtin.shell: "pkill -9 -f '[u]c-node-launch' || true; pkill -9 -f '[k]v_service' || true"
      changed_when: false
      failed_when: false

  always:
    - name: Remove netem shaping (always, idempotent)
      ansible.builtin.command: tc qdisc del dev {{ netem_iface }} root
      become: true
      failed_when: false
      changed_when: false
      when: netem_loss_pct | int > 0 or netem_delay_ms | int > 0
