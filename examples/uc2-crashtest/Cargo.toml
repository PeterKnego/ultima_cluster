[package]
name = "uc2-crashtest"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "uc2-crashtest-node"
path = "src/bin/uc2-crashtest-node.rs"

[[bin]]
name = "uc2-crashtest-service"
path = "src/bin/uc2-crashtest-service.rs"

[features]
hard-crash-tests = []
# M11 Task 3: the survival crashtest (backup-under-load -> host-destroyed ->
# restore -> rejoin, as a CI test). Empty like hard-crash-tests — just a gate
# so the multi-process/real-SIGKILL suite doesn't run by default.
survival-tests = []
# M11 Task 6: the ENOSPC crashtest (examples/uc2-crashtest/tests/enospc.rs).
# Empty like the others -- just a gate so this doesn't run by default. The
# genuine-ENOSPC test inside is further gated on the UC2_ENOSPC_DIR env var
# (elle-style: unset = skip cleanly); the sudo-free EACCES sibling in the
# same file runs unconditionally once this feature is on.
enospc-tests = []

[dependencies]
uc2_node      = { path = "../../uc2_node" }
uc2_service   = { path = "../../uc2_service" }
uc2_net       = { path = "../../uc2_net" }
uc2_consensus = { path = "../../uc2_consensus" }
# M8 Task 15: crypto-material fixture (key generation) for the hard-crash
# tests' UC2_CRYPTO=1 path, plus the node bin's --crypto-key/--crypto-allowlist
# CLI wiring. Already a transitive dep via uc2_node; declared directly because
# both the bin and the integration tests reference it by name.
uc2_crypto    = { path = "../../uc2_crypto" }
# pulls in the `RegisterSm: uc2_service::StateMachine` impl (the `v2` feature is
# now uc-lincheck's only SDK target).
uc-lincheck   = { path = "../../uc-lincheck", default-features = false, features = ["v2"] }
clap          = { version = "4", features = ["derive"] }
anyhow        = { workspace = true }

# uc-lincheck is already a [dependency] (used by the bins) and is therefore
# available to the integration tests too — no dev-dep needed.
[dev-dependencies]
uc2_client = { path = "../../uc2_client" }
# M7 Task 10: `sigkill_mid_config_window` drives the leader's cnc admin slot
# directly (the `uc2ctl`/`reconfig.rs` harness pattern), reading the cnc file
# without going through a client.
uc2_log      = { path = "../../uc2_log" }
uc_protocol  = { path = "../../uc_protocol" } # NODE_FLAG_LEADER/CAN_SERVE constants
tempfile   = { workspace = true }
rand       = { workspace = true } # seeded op selection in hard_crash.rs
