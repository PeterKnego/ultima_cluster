[package]
name = "uc_journal"
version.workspace = true
edition.workspace = true
description = "Runtime-agnostic segmented append journal + durable atomic-value primitive"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
crc32fast = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }
bincode = { version = "2", features = ["serde"], optional = true }

[features]
default = ["stable_value"]
stable_value = ["dep:serde", "dep:bincode"]
# Exposes `bench_support` (raw segment write + fsync primitives) so the
# autobench journal microbench can time the page-cache write and the fsync
# barrier in isolation. Not part of the supported API.
bench-support = []

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
