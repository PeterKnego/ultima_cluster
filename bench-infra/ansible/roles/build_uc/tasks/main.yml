---
- name: (rsync mode) Sync local UC working tree to host
  ansible.posix.synchronize:
    src: "{{ uc_local_path }}/"
    dest: "{{ uc_src_dir }}/"
    rsync_opts:
      - "--exclude=target"
      - "--exclude=.git"
      - "--exclude=bench-out"
      - "--exclude=bench-infra"   # don't ship .env secret or .terraform bloat
  when: uc_src_mode == "rsync"

# OPT-IN (ud_sync, default false). NOT needed for a normal build: ultima-db
# resolves from crates.io and uc_journal is an in-tree workspace member, so
# the workspace builds standalone — verified on the 2026-07-26 read-profile
# fleet run, where this task failed on all three hosts and every cargo build
# still succeeded.
#
# It IS needed when Cargo.toml's `[patch.crates-io] ultima-db = { path =
# "../ultima_db" }` line is uncommented for lockstep development: the UC tree
# sits at {{ uc_src_dir }} (= /opt/bench/uc), so `../ultima_db` must resolve to
# /opt/bench/ultima_db on the host. Enable with `-e ud_sync=true`.
#
# (The prior comment here claimed "without this, cargo build fails". That was
# true when ultima_db was an unconditional path dep and is no longer.)
- name: (rsync mode, opt-in) Sync sibling ultima_db for [patch.crates-io] lockstep builds
  ansible.posix.synchronize:
    src: "{{ ud_local_path }}/"
    dest: "{{ ud_src_dir }}/"
    rsync_opts:
      - "--exclude=target"
      - "--exclude=.git"
  when:
    - uc_src_mode == "rsync"
    - ud_sync | bool

- name: (git mode) Clone UC at pinned ref
  ansible.builtin.git:
    repo: "{{ uc_repo_url }}"
    dest: "{{ uc_src_dir }}"
    version: "{{ uc_git_ref }}"
  when: uc_src_mode == "git"

# UC v2 gate binaries are cargo examples under uc_node (release builds no examples
# by default, so name them explicitly). m6_gate carries node/service/learner/probe/
# loadclient roles; m5_gate is the throughput gate. The python gate orchestrators
# (scripts/m6_fleet_gate.py) also self-build the example on each host, so this both
# validates the build and warms the target dir for a fast orchestrator rebuild.
- name: Build UC v2 gate example binaries
  ansible.builtin.command: >
    {{ remote_home }}/.cargo/bin/cargo build --release
    -p uc_node --example m5_gate --example m6_gate
  args:
    chdir: "{{ uc_src_dir }}"
  environment:
    CARGO_HOME: "{{ remote_home }}/.cargo"
    RUSTUP_HOME: "{{ remote_home }}/.rustup"
  register: uc_build
  changed_when: "'Compiling' in uc_build.stderr or 'Finished' in uc_build.stderr"

- name: Verify UC v2 gate bins exist
  ansible.builtin.shell: |
    test -x {{ uc_target_bin }}/examples/m5_gate
    test -x {{ uc_target_bin }}/examples/m6_gate
  changed_when: false

- name: Record UC source provenance
  ansible.builtin.shell: |
    cd {{ uc_src_dir }} && (git rev-parse HEAD 2>/dev/null || echo "rsync-no-git"); \
    git status --porcelain 2>/dev/null | head -1 | grep -q . && echo "dirty" || echo "clean"
  register: uc_provenance
  changed_when: false
  run_once: true
