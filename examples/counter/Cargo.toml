[package]
name = "counter"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# The whole cluster in one process — the hello-world.
[[bin]]
name = "counter-single"
path = "src/bin/counter-single.rs"

# The three process roles, for running a real multi-node cluster locally.
[[bin]]
name = "counter-node"
path = "src/bin/counter-node.rs"

[[bin]]
name = "counter-service"
path = "src/bin/counter-service.rs"

[[bin]]
name = "counter-client"
path = "src/bin/counter-client.rs"

[dependencies]
uc2_node      = { path = "../../uc2_node" }
uc2_service   = { path = "../../uc2_service" }
uc2_client    = { path = "../../uc2_client" }
uc2_net       = { path = "../../uc2_net" }
uc2_consensus = { path = "../../uc2_consensus" }
serde         = { workspace = true }
clap          = { version = "4", features = ["derive"] }
anyhow        = { workspace = true }
tempfile      = { workspace = true }
