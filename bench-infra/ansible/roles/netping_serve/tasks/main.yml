---
# netping_serve — stand up PERSISTENT cross-host echo responders.
#
# UC UDP + QUIC responders start on EVERY node so any node can act as a
# follower in the fan-out (3-node Raft-replication) experiment while also
# acting as the single server in the 2-node single-target ping experiment.
# Idle echo servers on the leader (node0) are harmless.
#
# Aeron responder gates on `node_role == "node0"` (unchanged — Aeron is
# deferred; the 2 vCPU ccx13 is too small for a fair Aeron baseline anyway).
#
# Responders are detached via `setsid ... < /dev/null &` so the task returns
# immediately and they survive the SSH session / playbook end.

# --- Idempotent cleanup so re-running netping.yml is safe -------------------
# Bracket trick on pkill ('[i]nternode' / '[i]o.aeron') so the pattern does not
# match pkill's own shell command line.
- name: Clean stale netping responders
  ansible.builtin.shell: |
    pkill -9 -f '[i]nternode-rpc-bench' || true
    pkill -9 -f '[i]o.aeron' || true
  changed_when: false
  failed_when: false

- name: Brief settle after cleanup (ports release)
  ansible.builtin.pause:
    seconds: 2
  run_once: true

# --- UC UDP echo responder (all nodes) --------------------------------------
- name: Start UC UDP echo responder
  ansible.builtin.shell: |
    setsid {{ uc_target_bin }}/internode-rpc-bench \
      --role server --transport udp \
      --listen 0.0.0.0:{{ netping_udp_port }} \
      > {{ remote_home }}/netping-udp.out 2>&1 < /dev/null &
  changed_when: false

# --- UC QUIC echo responder (all nodes) -------------------------------------
- name: Start UC QUIC echo responder
  ansible.builtin.shell: |
    setsid {{ uc_target_bin }}/internode-rpc-bench \
      --role server --transport quic \
      --listen 0.0.0.0:{{ netping_quic_port }} \
      > {{ remote_home }}/netping-quic.out 2>&1 < /dev/null &
  changed_when: false

# --- Aeron echo responder (node0 only — deferred; ccx13 too small) ----------
# Reuses the existing media-driver launcher under {{ aeron_deploy_dir }} and the
# benchmarks "echo" responder. The echo launcher name is parameterized
# (aeron_echo_launcher, default "echo") — VERIFY against the built dist; the
# pre-check below fails fast with a hint if the script is missing.
- name: Verify Aeron echo launcher exists in the built dist
  ansible.builtin.stat:
    path: "{{ aeron_deploy_dir }}/scripts/aeron/{{ aeron_echo_launcher }}"
  register: aeron_echo_stat
  when: aeron_enabled | default(true) | bool and node_role == "node0"

- name: Fail if the configured Aeron echo launcher is absent
  ansible.builtin.fail:
    msg: >-
      Aeron echo launcher '{{ aeron_echo_launcher }}' not found under
      {{ aeron_deploy_dir }}/scripts/aeron/. List that dir on the host and set
      `aeron_echo_launcher` in group_vars to the correct script name
      (commonly 'echo' or 'remote').
  when:
    - aeron_enabled | default(true) | bool
    - node_role == "node0"
    - not aeron_echo_stat.stat.exists

- name: Start Aeron media driver (for echo responder)
  ansible.builtin.shell: |
    export JAVA_HOME="$(dirname $(dirname $(readlink -f $(which javac))))"
    export JVM_OPTS="-Xms16M"
    setsid {{ aeron_deploy_dir }}/scripts/aeron/media-driver \
      > {{ remote_home }}/netping-aeron-md.out 2>&1 < /dev/null &
  changed_when: false
  when: aeron_enabled | default(true) | bool and node_role == "node0"

- name: Brief settle for media driver
  ansible.builtin.pause:
    seconds: 3
  run_once: true
  when: aeron_enabled | default(true) | bool and node_role == "node0"

- name: Start Aeron echo responder
  ansible.builtin.shell: |
    export JAVA_HOME="$(dirname $(dirname $(readlink -f $(which javac))))"
    export JVM_OPTS="-Xms16M -Dio.aeron.benchmarks.output.directory={{ remote_home }}/results"
    setsid {{ aeron_deploy_dir }}/scripts/aeron/{{ aeron_echo_launcher }} \
      > {{ remote_home }}/netping-aeron-echo.out 2>&1 < /dev/null &
  changed_when: false
  when: aeron_enabled | default(true) | bool and node_role == "node0"

# --- Up-verification: catch a failed start at `up` time ---------------------
- name: Wait for responders to bind
  ansible.builtin.pause:
    seconds: 3
  run_once: true

- name: Verify UC UDP responder bound its port
  ansible.builtin.shell: |
    set -o pipefail
    ss -lunH 'sport = :{{ netping_udp_port }}' | grep -q ':{{ netping_udp_port }}'
  args:
    executable: /bin/bash
  changed_when: false

- name: Verify UC QUIC responder bound its (UDP) port
  ansible.builtin.shell: |
    set -o pipefail
    ss -lunH 'sport = :{{ netping_quic_port }}' | grep -q ':{{ netping_quic_port }}'
  args:
    executable: /bin/bash
  changed_when: false

- name: Verify Aeron echo responder process is alive
  ansible.builtin.shell: "pgrep -f '[i]o.aeron' >/dev/null"
  changed_when: false
  when: aeron_enabled | default(true) | bool and node_role == "node0"

- name: Report responder endpoints
  ansible.builtin.debug:
    msg: >-
      netping responders up on {{ private_ip }} ({{ node_role }}):
      UC-UDP={{ private_ip }}:{{ netping_udp_port }}
      UC-QUIC={{ private_ip }}:{{ netping_quic_port }}
      {{ 'Aeron-echo via ' + aeron_echo_launcher if (node_role == "node0" and (aeron_enabled | default(true) | bool)) else 'Aeron: N/A (follower or disabled)' }}
