name = "uc2-proofs"
version = "0.1.0"
defaultTargets = ["Uc2Model", "Uc2Proofs", "conform"]
# mathlib v4.35.0 is built for Lean's module system; these files are not
# (yet). Declare the mix explicitly instead of carrying one lake warning per
# mathlib import. Moving to `module` headers is its own change.
allowNonModules = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[lean_lib]]
name = "Uc2Model"

[[lean_lib]]
name = "Uc2Proofs"

[[lean_exe]]
name = "conform"
root = "Conform.Main"
