# =============================================================================
# Benchmark client — co-located with node0, talks to it over SHARED MEMORY.
#
# DIFF vs shipped scripts/samples/cluster_localhost/client.properties:
#   - aeron.dir: /dev/shm/client-driver -> /dev/shm/node0-driver
#       The client SHARES node0's media driver. That shared-memory region IS the
#       client<->node transport. No separate client media driver is launched
#       (see start_cluster.sh — the 4th media-driver line is removed).
#   - egress.channel: aeron:udp?endpoint=localhost:0 -> aeron:ipc
#       Replies come back over shared memory too, closing the full shmem edge.
#   - ingress.channel = aeron:ipc is inherited from cluster.properties.
#   - ingress.endpoints stays UNSET (required null for IPC ingress).
# =============================================================================

# Share node0's driver (== the co-located, appointed leader).
aeron.dir=/dev/shm/node0-driver

# Replies over shared memory.
aeron.cluster.egress.channel=aeron:ipc

# --- Load params: match ultima_cluster commit-path-load.rs run-for-run ---
# Open-loop fixed rate; sweep this across operating points.
io.aeron.benchmarks.message.rate=100
# Per-message (no burst) to match ultima's per-message pacing:
io.aeron.benchmarks.batch.size=1
# Payload bytes must equal ultima's --payload-bytes.
#io.aeron.benchmarks.message.length=32
# Discarded warmup, then measured window (iterations ~= seconds):
#io.aeron.benchmarks.warmup.iterations=5
#io.aeron.benchmarks.warmup.message.rate=100
#io.aeron.benchmarks.iterations=30
io.aeron.benchmarks.output.file=bench_out_ipc.txt
