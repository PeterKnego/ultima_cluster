syntax = "proto3";

package counter_loop;

// Service-side server streams one IncrementEvent per committed Inc command.
// At-least-once: events are bounded-mpsc-buffered on the server; if the
// subscriber is absent or has fallen behind, the service's OutputHandler
// returns Retryable and openraft's output dispatcher backs off and retries.
service IncrementNotifier {
  rpc Subscribe(SubscribeReq) returns (stream IncrementEvent);
}

message SubscribeReq {}

message IncrementEvent {
  string counter_name = 1;
  uint64 value        = 2;   // post-increment value
  uint64 log_index    = 3;   // raft log_index — used by client for dedup
}
