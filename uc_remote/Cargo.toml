[package]
name = "uc_remote"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "ultima_cluster remote protocol v2 (framed TCP) and the Rust remote client"

[dependencies]
bytes = { workspace = true }
thiserror = { workspace = true }
# Jumbo spec §8: the developer notification. `uc_obs` is a dependency-free
# std-only leaf, which is the only reason this crate — the one a third-party
# remote client COPIES — may take a UC dependency at all.
uc_obs = { path = "../uc_obs", version = "2.13.0" }

# Read-your-writes: `ReadToken` is ONE type shared with `uc_client`, so it is
# re-exported from the crate that owns it. (Before this, `uc_protocol` was
# dev-only; the wire ceilings in `engine.rs` are still local copies, pinned
# against it by a test.)
uc_protocol = { path = "../uc_protocol", version = "2.13.0" }

[dev-dependencies]
serde = { workspace = true }
bincode = { workspace = true }
