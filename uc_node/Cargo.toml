[package]
name = "uc_node"
description = "The ultima_cluster node: four single-writer polling agents, the cnc page, elections, and the uc2-node daemon"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "uc2-node"
path = "src/bin/uc2-node.rs"

[dependencies]
uc_protocol = { path = "../uc_protocol", version = "2.8.1" }
uc_obs = { path = "../uc_obs", version = "2.8.1" }
uc_log = { path = "../uc_log", version = "2.8.1" }
uc_net = { path = "../uc_net", version = "2.8.1" }
uc_consensus = { path = "../uc_consensus", version = "2.8.1" }
uc_crypto = { path = "../uc_crypto", version = "2.8.1" }
uc_journal = { workspace = true }
thiserror = { workspace = true }
fs2 = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
libc = { workspace = true }
signal-hook = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
# Dev-only cycle (permitted: every edge is a dev-dependency) — the Task 11
# barrier test drives the full read path with a real service + client.
# uc_service is deliberately unversioned: it comes AFTER uc_node in the
# publish DAG order (docs/how-to/cut-a-release.md), so a version here would
# make `cargo package`/`cargo publish` require an unresolvable forward
# reference. Cargo silently strips an unversioned path dev-dependency from
# the published manifest instead (standard idiom for a dev-only test cycle).
uc_service = { path = "../uc_service" }
uc_client = { path = "../uc_client", version = "2.8.1" }
# L3 lincheck port (Task 13): the WGL checker/history/model + CAS-register SM,
# built for the v2 SDK trait only (v1 `uc_service` is not pulled in here).
# NOTE: deliberately no `version =` — uc_lincheck is `publish = false` (never
# on crates.io); a versioned path dev-dep would make `cargo package` require
# it to resolve from the registry and fail forever. Cargo silently strips a
# path dev-dependency with no version from the packaged manifest instead.
uc_lincheck = { path = "../uc_lincheck", default-features = false, features = ["v2"] }
serde = { workspace = true }
bincode = { workspace = true }
tempfile = { workspace = true }
# Test-only: hand-write a ring file header (the unsized-claim wedge) the way a
# killed producer leaves it — see node.rs::tests::wedge_ring_file.
memmap2 = { workspace = true }
rand = { workspace = true }
# m5_gate (Task 15) / m6_gate (M6 Task 10): CLI parsing, latency histogram,
# error plumbing for the node/service/learner reference-binary + gate roles.
clap = { workspace = true }
hdrhistogram = { workspace = true }
anyhow = { workspace = true }

[features]
# Fault injection for the elle mutation-testing tier. Off in every normal
# build; even when compiled in, inert unless UC2_MUTATION is set.
mutation-testing = ["uc_consensus/mutation-testing"]

# read_profile (leader-lease profile harness) carries unit tests for its
# /proc occupancy parser; `test = true` makes `cargo test` run them.
[[example]]
name = "read_profile"
test = true

# `cfg(fuzzing)` is set by cargo-fuzz for the whole dependency graph; it gates
# the M12d `obs::http::route_raw` / `ObsSources::for_tests` seam (test-and-fuzz
# only, never in a shipped build). Declaring it here keeps `unexpected_cfgs`
# happy without turning the seam into a public Cargo feature, which would make
# it part of the crate's API surface.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
