[package]
name = "uc2_client"
description = "UC v2 sync shmem client SDK — cnc attach, MPSC submit/query, broadcast matcher"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
uc_protocol = { path = "../uc_protocol", version = "2.7.0" }
uc2_log = { path = "../uc2_log", version = "2.7.0" }
serde = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# uc2_node and uc2_service are deliberately unversioned: uc2_client is
# published EARLIER than both in the publish DAG order
# (docs/how-to/cut-a-release.md), so a version here would make
# `cargo package`/`cargo publish` require an unresolvable forward reference.
# Cargo silently strips an unversioned path dev-dependency from the published
# manifest instead (standard idiom for a dev-only test-time-only dependency).
uc2_node = { path = "../uc2_node" }
uc2_service = { path = "../uc2_service" }
uc2_net = { path = "../uc2_net", version = "2.7.0" }
tempfile = { workspace = true }
