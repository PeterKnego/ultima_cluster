[package]
name = "uc_diffreplay"
description = "Diff replay for ultima_cluster state machines: replay one corpus (snapshot + log span) through two FSM builds, diff everything they do on the captured surfaces, attribute each difference, confirm against declared intent"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "uc2-diffreplay"
path = "src/bin/uc2-diffreplay.rs"

[features]
default = ["export"]
# `corpus export` is the ONLY thing here that needs a node: it shells
# `uc_node::backup`'s ordered copy. An app that merely embeds the replay
# driver (`examples/kv`) takes `default-features = false` and links no node
# — otherwise every service binary in the tree drags the whole consensus
# crate in behind a verb it never calls.
export = ["dep:uc_node"]

[dependencies]
uc_service = { path = "../uc_service", version = "2.12.0" }
uc_protocol = { path = "../uc_protocol", version = "2.12.0" }
uc_journal = { workspace = true }
uc_node = { path = "../uc_node", version = "2.12.0", optional = true }
serde = { workspace = true }
serde_json = "1"
toml = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
# `drive_with`'s on_committed recorder (plan B2 T6): a `current_thread`
# runtime to `block_on` a `RawOutputHandler`, same shape `uc_service`'s own
# output agent pins (`uc_service/Cargo.toml`), minus `time` — this driver
# never sleeps inside a handler call.
tokio = { version = "1", default-features = false, features = ["rt"] }

[dev-dependencies]
# Named again here so the test targets (`tests/common/mod.rs` starts a real
# in-process node) do not depend on the optional `export` feature being on.
uc_node = { path = "../uc_node", version = "2.12.0" }
uc_lincheck = { path = "../uc_lincheck" }
uc_client = { path = "../uc_client" }
uc_net = { path = "../uc_net", version = "2.12.0" }
# `tests/reconstruction.rs` only: the cnc page carries the one observable that
# says a reattached service has finished reconstructing (`service_slot(i)
# .applied`), and `bincode` pins the command tag the declaration names ("00" =
# `Cmd::Write`) to the codec the client actually encodes with.
uc_log = { path = "../uc_log", version = "2.12.0" }
bincode = { workspace = true }
tempfile = { workspace = true }
