---
# netping.yml — bring up a small fleet ONCE with PERSISTENT echo responders so a
# separate uc_autobench driver can run many cross-host ping experiments without
# re-provisioning. Tear down with `make destroy` (responders die with the hosts;
# the ttl_hours backstop also applies).
#
# Typical use:  make up-ping        # 2-host ccx13 fleet + this playbook
#               <run driver pings against node0:9100 / :9101 / aeron>
#               make destroy
- name: Stand up persistent cross-host echo responders
  hosts: cluster
  become: true
  # Defer fact-gathering until AFTER wait_for_connection. With play-level
  # gather_facts:true, Ansible makes its first SSH (fact gathering) BEFORE
  # pre_tasks, so a freshly-booted host whose sshd isn't up yet fails
  # ("connection refused") before the wait ever runs. Gather explicitly below.
  gather_facts: false
  pre_tasks:
    - name: Wait for SSH to come up
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 180
    - name: Gather facts (after SSH is reachable)
      ansible.builtin.setup:
  roles:
    - toolchains
    - build_uc
    - role: build_aeron
      when: aeron_enabled | default(true) | bool
    - netping_serve
