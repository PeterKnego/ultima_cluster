[package]
name = "uc_service"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
description = "ultima_cluster service-side SDK — StateMachine + OutputHandler traits"

[features]
default = ["ultima_db"]
# Pulls in the `ultima_db` adapter module (StoreStateMachine + builder).
ultima_db = ["dep:ultima-db"]

[dependencies]
serde = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
uc_protocol = { path = "../uc_protocol" }
ultima-db = { workspace = true, optional = true }
