[package]
name = "uc_protocol"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "ultima_cluster wire protocol — shared-memory layouts, frames, versions"

[lints.rust]
# `cfg(loom)` is set by hand (RUSTFLAGS="--cfg loom") for tests/loom_mpsc.rs,
# never by a feature, so check-cfg has to be told about it. Mirrors
# uc2_log/Cargo.toml.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[dependencies]
# M3: ring buffer primitives need std (atomics + mmap). Pure data types
# (version, magic, error_codes) remain core-only-compatible.
libc = "0.2"
memmap2 = { workspace = true }
parking_lot = { workspace = true }
page_size = { workspace = true }
thiserror = { workspace = true }
crc32fast = { workspace = true }
# M5: OutputError (output.rs) needs serde for wire encoding
serde = { workspace = true }
bincode = { workspace = true }

[features]
# Commit-path latency probes. OFF by default: when off, every `stamp_*` is a
# zero-cost inline no-op and frame layout is unchanged. Enabled only for bench
# builds that opt into the attribution probe sink.
uc-bench-probes = []

[dev-dependencies]
tempfile = { workspace = true }

# M13a Task 5: the MPSC commit-protocol loom model (tests/loom_mpsc.rs). Only
# ever built under `RUSTFLAGS="--cfg loom"`, so a normal `cargo test` never
# resolves it.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"
