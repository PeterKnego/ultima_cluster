[package]
name = "uc2ctl"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Admin CLI for live ultima_cluster reconfiguration"

# Deliberately its own crate rather than a bin inside `uc2_node`: uc2ctl talks
# to a running node purely through the cnc page's admin slots, so the live
# reconfiguration verbs need only `uc2_log` and `uc_protocol`, not `uc2_node`
# itself — that split is what keeps `clap` off the node library's dependency
# graph for every consumer. M11 Task 2's `backup`/`verify-backup`/`restore`
# verbs are the one exception: they are OFFLINE (filesystem-only, no cnc
# admin-band interaction at all — see `uc2_node::backup`'s module doc) and
# reuse that module's `backup_instance`/`verify_artifact`/`restore_artifact`
# rather than reimplementing them here, so `uc2_node` becomes a dependency
# for THOSE three verbs specifically.
[dependencies]
uc2_log = { path = "../uc2_log", version = "2.7.0" }
uc2_node = { path = "../uc2_node", version = "2.7.0" }
uc_protocol = { path = "../uc_protocol", version = "2.7.0" }
# M12b Task 6: `--admin-key` signing + `gen-admin-key` — the canonical
# `AdminMessage`/`sign`/`AdminKey`/`generate_key_file` live here so this CLI
# builds the exact same byte layout the node verifies, rather than
# reimplementing it.
uc2_crypto = { path = "../uc2_crypto", version = "2.7.0" }
clap = { workspace = true }
anyhow = { workspace = true }
# A per-request nonce, so a response can never be mistaken for a stale one.
rand = { workspace = true }

[dev-dependencies]
# admin_auth_bin.rs starts a real node IN-PROCESS (uc2_node is already a
# regular dependency above) and needs `FaultConfig` for `NodeConfig`.
uc2_net = { path = "../uc2_net", version = "2.7.0" }
tempfile = { workspace = true }
