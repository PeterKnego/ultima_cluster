# Pinned stable used for local dev, CI's `test`/`deny`/`publish-check` jobs,
# and releases (rustup auto-installs this on first use in this tree). This is
# a CEILING, bumped deliberately — it is NOT the workspace's MSRV floor; that
# is `rust-version` in the root Cargo.toml (`[workspace.package]`), enforced
# separately by CI's `msrv` job. To bump: `rustup toolchain install <ver>
# --profile minimal --component rustfmt --component clippy`, update the
# `channel` below, then re-run the full local proof stack before committing.
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
